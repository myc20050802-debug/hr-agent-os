<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HR-Agent OS · B端 HR AI Agent SaaS 平台原型</title>
<style>/* ===========================================================
   HR-Agent OS · 后台设计系统（暗色）
   =========================================================== */
:root{
  --bg:#0d0f14; --bg2:#11141b; --panel:#161a23; --panel2:#1b2029; --panel3:#20262f;
  --line:#262c39; --line2:#333b4d;
  --tx:#e7eaf1; --tx2:#a8b1c2; --tx3:#6f7a8d;
  --ac:#4c8dff; --ac2:#7aa9ff; --acbg:rgba(76,141,255,.12);
  --grn:#3ddc97; --grnbg:rgba(61,220,151,.13);
  --yel:#f5b942; --yelbg:rgba(245,185,66,.14);
  --red:#ff6b6b; --redbg:rgba(255,107,107,.13);
  --pur:#a78bfa; --purbg:rgba(167,139,250,.14);
  --mono:ui-monospace,SFMono-Regular,"Cascadia Mono","JetBrains Mono",Consolas,monospace;
  --r:11px; --sh:0 8px 30px rgba(0,0,0,.38);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);
  font:14px/1.62 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  overflow:hidden}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#2c3444;border-radius:6px}
::-webkit-scrollbar-thumb:hover{background:#3b465c}
::-webkit-scrollbar-track{background:transparent}
button{font-family:inherit;cursor:pointer}
a{color:var(--ac2);text-decoration:none}

/* ---------- 布局 ---------- */
#app{display:grid;grid-template-columns:238px minmax(0,1fr);height:100vh}
#app.collapsed{grid-template-columns:60px minmax(0,1fr)}
#app.collapsed .navtext,#app.collapsed .logo-txt,#app.collapsed .navgroup-title,
#app.collapsed .tenant-info,#app.collapsed .usermeta{display:none}
#app.collapsed .navitem{justify-content:center;padding:9px 0}
#app.collapsed .navitem .ico{font-size:16px}

aside{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.logo{display:flex;align-items:center;gap:10px;padding:15px 16px;border-bottom:1px solid var(--line);flex-shrink:0}
.logo .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#4c8dff,#a78bfa);
  display:grid;place-items:center;font-size:14px;flex-shrink:0}
.logo-txt{font-weight:700;font-size:14.5px;letter-spacing:.2px;white-space:nowrap}
.logo-txt small{display:block;font-weight:400;font-size:10.5px;color:var(--tx3);letter-spacing:0}

.tenant{margin:10px 10px 4px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);
  border-radius:9px;font-size:12px;display:flex;align-items:center;gap:8px;cursor:pointer}
.tenant:hover{border-color:var(--line2)}
.tenant .badge{background:var(--acbg);color:var(--ac2);border-radius:5px;padding:1px 6px;font-size:10.5px;white-space:nowrap}
.tenant-info{min-width:0}
.tenant-info b{display:block;font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tenant-info span{color:var(--tx3);font-size:10.5px}

nav{flex:1;overflow-y:auto;padding:8px 8px 20px}
.navgroup-title{font-size:10.5px;color:var(--tx3);letter-spacing:.9px;padding:14px 10px 6px;font-weight:600}
.navitem{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:9px;color:var(--tx2);
  font-size:13px;cursor:pointer;user-select:none;white-space:nowrap;position:relative}
.navitem:hover{background:var(--panel);color:var(--tx)}
.navitem.active{background:var(--acbg);color:#fff;font-weight:600}
.navitem.active::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2.5px;border-radius:2px;background:var(--ac)}
.navitem .ico{width:17px;text-align:center;font-size:14px;flex-shrink:0}
.navitem .cnt{margin-left:auto;background:var(--redbg);color:var(--red);font-size:10.5px;
  padding:1px 6px;border-radius:9px;font-weight:600}
.navsub{padding-left:0}
.navsub .navitem{padding-left:36px;font-size:12.5px}
#app.collapsed .navsub .navitem{padding-left:0}

.userbar{border-top:1px solid var(--line);padding:10px 12px;display:flex;align-items:center;gap:9px;flex-shrink:0}
.avatar{width:27px;height:27px;border-radius:50%;background:linear-gradient(135deg,#3ddc97,#4c8dff);
  display:grid;place-items:center;font-size:11.5px;font-weight:700;color:#0d0f14;flex-shrink:0}
.usermeta{min-width:0;font-size:12px}
.usermeta b{display:block;font-size:12.5px}
.usermeta span{color:var(--tx3);font-size:10.5px}

main{display:flex;flex-direction:column;overflow:hidden;min-width:0}
header{height:54px;flex-shrink:0;border-bottom:1px solid var(--line);background:var(--bg2);
  display:flex;align-items:center;gap:12px;padding:0 18px}
.iconbtn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);
  color:var(--tx2);display:grid;place-items:center;font-size:13px}
.iconbtn:hover{color:var(--tx);border-color:var(--line2)}
.crumb{color:var(--tx3);font-size:12.5px}
.crumb b{color:var(--tx);font-weight:600}
.spacer{flex:1}
.searchbar{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 11px;
  color:var(--tx3);font-size:12.5px;width:210px;display:flex;align-items:center;gap:7px}
.searchbar input{background:none;border:none;outline:none;color:var(--tx);font-size:12.5px;width:100%;
  font-family:inherit}
.searchbar input::placeholder{color:var(--tx3)}
.btn{border:1px solid var(--line2);background:var(--panel);color:var(--tx);border-radius:9px;
  padding:7px 13px;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ac);background:var(--panel2)}
.btn.primary{background:linear-gradient(135deg,#4c8dff,#3a6fe0);border-color:#4c8dff;color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 9px;font-size:11.5px;border-radius:7px}
.btn.danger{border-color:rgba(255,107,107,.5);color:var(--red)}
.btn.danger:hover{background:var(--redbg)}
.btn:disabled{opacity:.45;cursor:not-allowed}

.content{flex:1;overflow-y:auto;padding:20px 22px 80px;min-height:0}
.page-head{margin-bottom:16px}
.page-head h2{margin:0 0 5px;font-size:19px;display:flex;align-items:center;gap:9px}
.page-head p{margin:0;color:var(--tx3);font-size:12.8px;max-width:900px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.col{flex:1;min-width:320px}

/* ---------- 卡片 ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px}
.card.pad0{padding:0;overflow:hidden}
.card-h{display:flex;align-items:center;gap:9px;margin-bottom:12px}
.card-h h3{margin:0;font-size:14px;font-weight:650}
.card-h .spacer{flex:1}
.card.pad0 .card-h{padding:13px 16px 0;margin-bottom:10px}
.card-sub{color:var(--tx3);font-size:11.8px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:13px 15px;position:relative;overflow:hidden}
.kpi .k-label{color:var(--tx3);font-size:11.8px;display:flex;align-items:center;gap:5px}
.kpi .k-val{font-size:25px;font-weight:700;margin:5px 0 2px;letter-spacing:-.5px}
.kpi .k-val small{font-size:12.5px;font-weight:500;color:var(--tx3);margin-left:3px}
.kpi .k-foot{font-size:11.5px;color:var(--tx3)}
.kpi .k-foot .up{color:var(--grn)}
.kpi .k-foot .down{color:var(--red)}
.kpi::after{content:"";position:absolute;right:-24px;top:-24px;width:80px;height:80px;border-radius:50%;
  background:radial-gradient(circle,rgba(76,141,255,.13),transparent 70%)}

/* ---------- 表格 ---------- */
.tblwrap{overflow-x:auto;border-radius:10px;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:12.8px}
th{background:var(--panel2);text-align:left;padding:9px 11px;font-weight:640;color:var(--tx2);
  border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px;position:sticky;top:0}
td{padding:9px 11px;border-bottom:1px solid var(--line);color:var(--tx2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover td{background:rgba(76,141,255,.05)}
td.name{color:var(--tx);font-weight:600}
.tbl-empty{padding:26px;text-align:center;color:var(--tx3);font-size:12.5px}

/* ---------- 标签 ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.2px;padding:2px 8px;border-radius:6px;
  border:1px solid transparent;white-space:nowrap}
.tag.g{background:var(--grnbg);color:var(--grn);border-color:rgba(61,220,151,.28)}
.tag.y{background:var(--yelbg);color:var(--yel);border-color:rgba(245,185,66,.28)}
.tag.r{background:var(--redbg);color:var(--red);border-color:rgba(255,107,107,.28)}
.tag.b{background:var(--acbg);color:var(--ac2);border-color:rgba(76,141,255,.28)}
.tag.p{background:var(--purbg);color:var(--pur);border-color:rgba(167,139,250,.28)}
.tag.n{background:var(--panel3);color:var(--tx3);border-color:var(--line2)}
.pii{background:#2a2233;color:#c9a6ff;border-radius:4px;padding:0 4px;font:11.5px var(--mono);border:1px dashed #6b4fa8}

.bar{height:6px;border-radius:4px;background:var(--panel3);overflow:hidden;min-width:56px}
.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#4c8dff,#7aa9ff)}
.bar i.g{background:linear-gradient(90deg,#2fae78,#3ddc97)}
.bar i.y{background:linear-gradient(90deg,#c9942d,#f5b942)}
.bar i.r{background:linear-gradient(90deg,#c94f4f,#ff6b6b)}

/* ---------- 表单 ---------- */
label.f{display:block;font-size:12px;color:var(--tx2);margin:0 0 5px}
input.i,textarea.i,select.i{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:9px;
  color:var(--tx);padding:8px 11px;font-size:13px;font-family:inherit;outline:none}
input.i:focus,textarea.i:focus,select.i:focus{border-color:var(--ac)}
textarea.i{resize:vertical;line-height:1.6}
.field{margin-bottom:12px}
.checks{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--tx2)}
.checks label{display:flex;align-items:center;gap:6px;cursor:pointer}

/* ---------- 弹层 ---------- */
.overlay{position:fixed;inset:0;background:rgba(6,8,12,.66);backdrop-filter:blur(3px);z-index:200;
  display:none;justify-content:flex-end}
.overlay.on{display:flex}
.drawer{width:min(560px,94vw);height:100%;background:var(--bg2);border-left:1px solid var(--line2);
  display:flex;flex-direction:column;box-shadow:var(--sh);animation:slidein .22s ease}
@keyframes slidein{from{transform:translateX(26px);opacity:.4}to{transform:none;opacity:1}}
.drawer-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer-h h3{margin:0;font-size:14.5px}
.drawer-b{flex:1;overflow-y:auto;padding:16px 18px}
.drawer-f{border-top:1px solid var(--line);padding:12px 18px;display:flex;gap:9px;justify-content:flex-end}
.modal{width:min(620px,94vw);margin:auto;background:var(--bg2);border:1px solid var(--line2);
  border-radius:14px;box-shadow:var(--sh);overflow:hidden;animation:pop .2s ease}
.overlay.center{align-items:center;justify-content:center}
@keyframes pop{from{transform:scale(.96);opacity:.5}to{transform:none;opacity:1}}

/* ---------- Agent 运行追踪 ---------- */
.plan-step{display:flex;gap:11px;padding:10px 0;border-bottom:1px dashed var(--line);position:relative}
.plan-step:last-child{border-bottom:none}
.step-ico{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);color:var(--tx3);
  display:grid;place-items:center;font-size:11px;flex-shrink:0;background:var(--bg2);z-index:1}
.plan-step.run .step-ico{border-color:var(--ac);color:var(--ac);animation:pulse 1.1s infinite}
.plan-step.done .step-ico{border-color:var(--grn);background:var(--grnbg);color:var(--grn)}
.plan-step.wait .step-ico{border-color:var(--yel);background:var(--yelbg);color:var(--yel)}
.plan-step.err .step-ico{border-color:var(--red);background:var(--redbg);color:var(--red)}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(76,141,255,.5)}50%{box-shadow:0 0 0 5px rgba(76,141,255,0)}}
.plan-step .sbody{flex:1;min-width:0}
.plan-step .stitle{font-size:13px;color:var(--tx)}
.plan-step.pending .stitle{color:var(--tx3)}
.plan-step .smeta{font:11.2px var(--mono);color:var(--tx3);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.plan-step .sout{margin-top:6px;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:7px 9px;font:11.4px var(--mono);color:var(--tx2);white-space:pre-wrap;word-break:break-all}

/* ---------- 聊天 ---------- */
.chatwrap{display:flex;flex-direction:column;height:calc(100vh - 200px);min-height:420px}
.chatlog{flex:1;overflow-y:auto;padding:4px 2px 10px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:10px;max-width:100%}
.msg .bub{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 13px;
  font-size:13.2px;max-width:660px;line-height:1.7}
.msg.me{flex-direction:row-reverse}
.msg.me .bub{background:var(--acbg);border-color:rgba(76,141,255,.34)}
.msg .av{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:12px;flex-shrink:0;
  background:var(--panel3)}
.msg.ai .av{background:linear-gradient(135deg,#4c8dff,#a78bfa);color:#0d0f14}
.cite{margin-top:9px;border-top:1px dashed var(--line);padding-top:8px;font-size:11.8px;color:var(--tx3)}
.cite b{color:var(--ac2);font-weight:600}
.cite .src{display:block;margin-top:4px}
.qchips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.qchip{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:5px 12px;
  font-size:12px;color:var(--tx2);cursor:pointer}
.qchip:hover{border-color:var(--ac);color:var(--tx)}
.thinking{display:flex;align-items:center;gap:8px;color:var(--tx3);font-size:12.5px}
.dots i{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--tx3);margin-right:3px;
  animation:bnc 1.2s infinite}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes bnc{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-4px);opacity:1}}

/* ---------- 流程图 / 编排 ---------- */
.flow{display:flex;flex-direction:column;gap:0}
.flownode{background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;
  font-size:12.8px;position:relative}
.flownode.trig{border-color:rgba(61,220,151,.42)}
.flownode.act{border-color:rgba(76,141,255,.42)}
.flownode.hitl{border-color:rgba(245,185,66,.45)}
.flownode .nt{font-size:10.8px;color:var(--tx3);letter-spacing:.5px;margin-bottom:3px}
.flink{height:20px;width:2px;background:var(--line2);margin-left:22px;position:relative}
.flink::after{content:"";position:absolute;bottom:0;left:-3px;border:4px solid transparent;border-top-color:var(--line2)}

/* ---------- 时间线 ---------- */
.tl{position:relative;padding-left:19px}
.tl::before{content:"";position:absolute;left:5px;top:5px;bottom:5px;width:1.5px;background:var(--line)}
.tl-item{position:relative;padding:0 0 14px}
.tl-item::before{content:"";position:absolute;left:-18px;top:5px;width:8px;height:8px;border-radius:50%;
  background:var(--panel3);border:1.5px solid var(--line2)}
.tl-item.ok::before{background:var(--grn);border-color:var(--grn)}
.tl-item.warn::before{background:var(--yel);border-color:var(--yel)}
.tl-item.dang::before{background:var(--red);border-color:var(--red)}
.tl-item .tt{font:11.4px var(--mono);color:var(--tx3)}
.tl-item .tb{font-size:12.8px;color:var(--tx2);margin-top:2px}

/* ---------- 看板 ---------- */
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.kbcol{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px;min-height:150px}
.kbcol h4{margin:0 0 10px;font-size:12.5px;display:flex;align-items:center;gap:7px;color:var(--tx2)}
.kbcol h4 .cnt{margin-left:auto;background:var(--panel3);border-radius:8px;padding:0 6px;font-size:11px}
.kbcard{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 10px;
  margin-bottom:8px;font-size:12.5px;cursor:pointer}
.kbcard:hover{border-color:var(--line2)}
.kbcard .n{font-weight:600;color:var(--tx);display:flex;align-items:center;gap:6px}
.kbcard .m{color:var(--tx3);font-size:11.3px;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- 杂项 ---------- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--tx3)}
.small{font-size:11.8px}
.divider{height:1px;background:var(--line);margin:14px 0}
.list-dot{padding-left:17px;margin:7px 0;font-size:12.8px;color:var(--tx2)}
.list-dot li{margin:5px 0}
.hr-note{background:linear-gradient(90deg,rgba(167,139,250,.1),transparent);border-left:3px solid var(--pur);
  border-radius:0 9px 9px 0;padding:10px 13px;font-size:12.6px;color:#d9def0;margin:11px 0}

/* ---- JD 正文渲染（Markdown 子集 → HTML，见 app.js renderJD） ---- */
.jd-doc{line-height:1.72;font-size:12.6px;color:var(--tx2)}
.jd-h1{font-size:15px;font-weight:700;color:var(--tx);margin:2px 0 8px}
.jd-h2{font-size:13.4px;font-weight:700;color:var(--ac2);margin:14px 0 6px;
  padding-bottom:5px;border-bottom:1px solid var(--line)}
.jd-h3{font-size:12.6px;font-weight:600;color:var(--tx);margin:11px 0 5px}
.jd-li{padding-left:14px;text-indent:-14px;margin:3px 0}
.jd-p{margin:3px 0}
.jd-gap{height:5px}
.jd-doc b{color:var(--tx);font-weight:600}
.callout{background:var(--panel2);border:1px solid var(--line2);border-radius:9px;padding:10px 13px;
  font-size:12.6px;color:var(--tx2);margin:11px 0}
.callout b{color:var(--tx)}
.scanwarn{background:var(--yelbg);border:1px solid rgba(245,185,66,.34);border-radius:9px;
  padding:9px 12px;font-size:12.5px;color:var(--yel);margin:9px 0}
.scanok{background:var(--grnbg);border:1px solid rgba(61,220,151,.3);border-radius:9px;
  padding:9px 12px;font-size:12.5px;color:var(--grn);margin:9px 0}
.toast{position:fixed;right:20px;bottom:20px;z-index:400;display:flex;flex-direction:column;gap:8px}
.toast .t{background:var(--panel2);border:1px solid var(--line2);border-left:3px solid var(--grn);
  border-radius:9px;padding:10px 14px;font-size:12.8px;box-shadow:var(--sh);animation:slidein .2s ease}
.toast .t.err{border-left-color:var(--red)}
.toast .t.warn{border-left-color:var(--yel)}
.skeleton{background:linear-gradient(90deg,var(--panel2),var(--panel3),var(--panel2));
  background-size:200% 100%;animation:sk 1.3s infinite;border-radius:6px;height:12px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
@media(max-width:900px){#app{grid-template-columns:60px minmax(0,1fr)}
  #app .navtext,#app .logo-txt,#app .navgroup-title,#app .tenant-info,#app .usermeta{display:none}
  .content{padding:14px}}
</style>
</head>
<body>
<div id="app">
  <!-- ============ 侧边栏（对应 PRD 第七部分菜单结构） ============ -->
  <aside>
    <div class="logo">
      <div class="dot">🤖</div>
      <div class="logo-txt">HR-Agent OS<small>智能体时代的人力资源平台</small></div>
    </div>
    <div class="tenant">
      <span>🏢</span>
      <div class="tenant-info">

  /* 字符 bigram 集合 —— 用于「行业语境句是否与已有职责重复」的判定 */
  function bigrams(s) {
    const x = norm(s);
    const out = new Set();
    for (let i = 0; i < x.length - 1; i++) out.add(x.slice(i, i + 2));
    return out;
  }
  /* 最长公共子串长度 —— 判定「整句近似重复」比 bigram 覆盖率更准
     （行业句与职能句往往共用一两个长短语，而不是整体重合）。 */
  function lcsLen(a, b) {
    const x = norm(a), y = norm(b);
    if (!x || !y) return 0;
    let best = 0;
    const dp = new Array(y.length + 1).fill(0);
    for (let i = 1; i <= x.length; i++) {
      let prev = 0;
      for (let j = 1; j <= y.length; j++) {
        const tmp = dp[j];
        dp[j] = x[i - 1] === y[j - 1] ? prev + 1 : 0;
        if (dp[j] > best) best = dp[j];
        prev = tmp;
      }
    }
    return best;
  }
  /* 行业语境句：与已选职责去重后才追加，避免「同一件事在 JD 里说两遍」。
     两道闸：① 与某条职责存在 ≥8 字的公共子串（近似整句重复）；
             ② 与某条职责的 bigram 重合度 ≥0.5（相对较短者）。
     行业句写成「指标 + 行话」口径，与职能句（动作口径）天然互补，
     正常不会被误杀；被拦只说明该职能族本身已完整覆盖了行业表达。 */
  function industryDuty(industry, duties) {
    const ctx = INDUSTRY_CTX[industry];
    if (!ctx || !ctx.duty) return '';
    const cb = bigrams(ctx.duty);
    const dup = (duties || []).some(d => {
      if (lcsLen(ctx.duty, d) >= 8) return true;
      const db = bigrams(d);
      if (!db.size || !cb.size) return false;
      let inter = 0;
      cb.forEach(g => { if (db.has(g)) inter++; });
      return inter / Math.min(cb.size, db.size) >= 0.5;
    });
    return dup ? '' : ctx.duty;
  }

  /* =========================================================
     二、职能识别
     规则：岗位名命中权重 3，已填要求正文命中权重 1；
          识别不出返回 null（调用方退回行业词库兜底）
     ========================================================= */
  function detectFunction(title, texts) {
    const t = norm(title);
    const body = norm(Array.isArray(texts) ? texts.join(' ') : (texts || ''));
    if (!t && !body) return null;
    let best = null, bestScore = 0;
    Object.keys(FUNCTIONS).forEach(key => {
      const f = FUNCTIONS[key];
      let s = 0;
      f.kw.forEach(k => {
        const kk = norm(k);
        if (!kk) return;
        if (t.indexOf(kk) >= 0) s += 3;
        else if (body.indexOf(kk) >= 0) s += 1;
      });
      /* weak（可选）：语境依赖的通用动作词，命中只加 1 分。
         用途是让「运维」不压过领域强词（光伏／设备），
         同时在它成为唯一命中者时，仍能把「运维工程师」识别为技术研发。 */
      (f.weak || []).forEach(k => {
        const kk = norm(k);
        if (kk && (t.indexOf(kk) >= 0 || body.indexOf(kk) >= 0)) s += 1;
      });
      if (s > bestScore) { bestScore = s; best = key; }
    });
    return bestScore > 0 ? best : null;
  }

  /* =========================================================
     二·五、职责选取（同族不同岗，挑出最贴近的几句）
     为什么需要：一族职责池有 8 条，全塞进 JD 会又长又泛；
     按子方向标签 k 与岗位名做匹配（岗位名 ×3、正文 ×1），
     命中的优先、其余按原顺序补足到 max 条。
     纯规则、确定性 —— 同一岗位每次产出完全一致，可回归。
     ========================================================= */
  function pickDuties(fn, title, texts, max) {
    const list = (fn && fn.duties) || [];
    if (!list.length) return [];
    const t = norm(title);
    const body = norm(Array.isArray(texts) ? texts.join(' ') : (texts || ''));
    const items = list.map((d, i) => {
      const obj = typeof d === 'string' ? { t: d, k: [] } : d;
      let s = 0;
      (obj.k || []).forEach(k => {
        const kk = norm(k);
        if (!kk) return;
        if (t.indexOf(kk) >= 0) s += 3;
        else if (body.indexOf(kk) >= 0) s += 1;
      });
      return { t: obj.t, s: s, i: i };
    });
    /* 命中句按分数降序（同分保持原顺序），未命中句按原顺序跟在后面 */
    const hit = items.filter(x => x.s > 0).sort((a, b) => b.s - a.s || a.i - b.i);
    const rest = items.filter(x => x.s === 0);
    const n = Math.max(4, Math.min(Number(max) || 6, items.length));
    return hit.concat(rest).slice(0, n).map(x => x.t);
  }

  /* =========================================================
     二·六、岗位层级识别（管培生 / 实习 / 应届）
     为什么单独识别：同一职能下，「3 年以上经验」对社招岗是硬要求，
     对管培生 / 实习岗就是错的 —— 会直接把应届生全部拦在门外。
     命中即把「工作经验」维度换成无经验 / 对口实习口径。
     ========================================================= */
  const JUNIOR_KW = ['管培生', '培训生', '实习生', '实习', '应届', '校招', '储备干部', '见习', '学徒', '无经验可', '经验不限'];

  function detectJunior(title, texts) {
    const t = norm(title);
    const body = norm(Array.isArray(texts) ? texts.join(' ') : (texts || ''));
    if (!t && !body) return false;
    return JUNIOR_KW.some(k => {
      const kk = norm(k);
      return kk && (t.indexOf(kk) >= 0 || body.indexOf(kk) >= 0);
    });
  }

  /* =========================================================
     三、技能关键词全集
     用途：① 从岗位要求文本里抽出「打分关键词」
          ② 新建岗位时的技能兜底池
     注意：只做「文本包含」匹配，不做语义猜测 —— 保证可复现。
     ========================================================= */
  function buildSkillUniverse(industrySkills) {
    const all = new Set();
    Object.keys(FUNCTIONS).forEach(k => {
      const f = FUNCTIONS[k];
      [...f.core, ...f.biz, ...f.plus].forEach(v => all.add(v));
    });
    if (industrySkills) {
      Object.keys(industrySkills).forEach(ind => {
        const lib = industrySkills[ind];
        [...(lib.core || []), ...(lib.biz || []), ...(lib.plus || [])].forEach(v => all.add(v));
      });
    }
    return [...all];
  }

  function extractKeywords(texts, industrySkills) {
    const bag = norm(Array.isArray(texts) ? texts.join(' ') : (texts || ''));
    if (!bag) return [];
    const hit = buildSkillUniverse(industrySkills).filter(k => bag.indexOf(norm(k)) >= 0);
    /* 冗余裁剪：若某个被命中词是另一个被命中词的子串，只保留更短的那条。
       例：文本里同时含「需求分析」与「需求分析与技术方案设计」时，只留「需求分析」——
       否则关键词列表会同时出现长短两条，简历技能标签也会变啰嗦。 */
    const pairs = hit.map(k => ({ k: k, n: norm(k) }));
    return pairs
      .filter(a => !pairs.some(b => b.k !== a.k && b.n.length < a.n.length && a.n.indexOf(b.n) >= 0))
      .map(a => a.k);
  }

  /* =========================================================
     七、JD 原文还原与段落化（v0.9.8）

     背景：HR 常把「一整段 JD 文案」粘进任职要求。旧版把字符串按
     [,，;；\n] 切开 —— 「，」被当成了条目分隔符：一句正常的话
     「和顶尖算法、工程团队并肩，把想法快速上线」被劈成两条，再各自
     加上编号。一份 300 字的 JD 能变成 20 个碎片，看起来就是「零散堆砌」。

     现在分三步：
       A 还原：剥掉行首残留符号（· • - 1. （1） ①），并把「上一行没说完」
               的断行合并回去；
       B 归位：认出「你会做什么 / 我们想找这样的你 / 有这些更香」这类
               小标题，把内容分到 职责 / 任职要求 / 加分项 / 福利 四个桶；
       C 成段：输出时不再逐条编号，同一维度并成一段自然行文。

     关键取舍：条目边界只由「换行」和「行首列表符号」决定，
     「，」「；」「、」一律不再当分隔符 —— 它们是句中标点。
     这条同时保证了「表单一行一条 → 提交 → 再载入表单」的往返无损：
     条目入库前已被 cleanReq 剥掉尾部标点，重新解析不会黏成一条。
     ========================================================= */
  /* 行首残留符号 */
  const RE_LI_MARK = /^[·•▪▫◦・∙●○◆■□★☆※→➤+]\s*/;
  const RE_LI_DASH = /^[-–—]\s+/;
  const RE_LI_NUM = /^\d{1,2}\s*[.、)）:：]\s+/;
  const RE_LI_PAREN = /^[（(]\s*\d{1,2}\s*[)）]\s*/;
  const RE_LI_CIRCLE = /^[①-⑳㉑-㉟]\s*/;
  const RE_MD_HEAD = /^#{1,6}\s*/;
  const RE_CN_NUM = /^[（(]?\s*[一二三四五六七八九十]{1,3}\s*[、.．)）]\s*/;
  /* 小标题词：识别与归位共用一套，避免「认出来了却归错桶」。
     只收「一看就是标签」的词，不收裸的「要求 / 技能 / 学历」——
     否则「有相关证书要求」这类句子会被当成标题吞掉。 */
  const RE_HEAD_ANY = /(更香|加分项|加分条件|你会做什么|主要做什么|工作内容|主要职责|岗位职责|职责描述|你将负责|主要工作|日常工作|我们提供|福利待遇|福利|待遇|你将获得|团队介绍|关于我们|公司简介|岗位亮点|任职要求|岗位要求|招聘要求|资格要求|能力要求|技能要求|经验要求|学历要求|其他要求|基本要求|我们想找|我们要找|我们期待|我们希望)/;
  const RE_HEAD_NICE = /(更香|加分)/;
  const RE_HEAD_BENEFIT = /(我们提供|福利|待遇|你将获得|团队介绍|关于我们|公司简介|岗位亮点)/;
  const RE_HEAD_DUTY = /(你会做什么|主要做什么|工作内容|职责|你将负责|主要工作|日常工作)/;
  /* 「这行是一句要求，不是小标题」——以这些词开头的裸行不当标题 */
  const RE_REQ_START = /^(熟悉|精通|掌握|具备|具有|熟练|负责|本科|大专|硕士|博士|应届|无|须|需|能|会|可|有|年龄|性别|年以上|经验|\d)/;
  const RE_END_SENT = /[。！？!?…]$/;
  const RE_END_MID = /[，,、；;：:]$/;

  function parseReqText(raw) {
    const lines = String(raw == null ? '' : raw).replace(/\r\n?/g, '\n').split('\n');
    const b = { lead: [], duty: [], must: [], nice: [], benefit: [] };
    let key = 'lead', cur = null, heads = 0;
    const flush = () => { if (cur && cur.text) b[key].push(cur.text); cur = null; };
    const nextNonEmpty = i => { for (let j = i + 1; j < lines.length; j++) { if (lines[j].trim()) return lines[j].trim(); } return ''; };
    const nextMarked = i => {
      const n = nextNonEmpty(i);
      return RE_LI_MARK.test(n) || RE_LI_DASH.test(n) || RE_LI_NUM.test(n) || RE_LI_PAREN.test(n) || RE_LI_CIRCLE.test(n);
    };

    lines.forEach((rawLine, i) => {
      if (!rawLine.trim()) { flush(); return; }              /* 空行 = 段落边界 */
      let s = rawLine.trim();
      let marked = false, mdHead = false, numHead = false;
      if (RE_MD_HEAD.test(s)) { mdHead = true; s = s.replace(RE_MD_HEAD, '').trim(); }
      for (let k = 0; k < 4; k++) {                          /* 容忍「1. · 内容」这类叠加 */
        const before = s;
        if (RE_LI_MARK.test(s)) { marked = true; s = s.replace(RE_LI_MARK, '').trim(); }
        if (RE_LI_DASH.test(s)) { marked = true; s = s.replace(RE_LI_DASH, '').trim(); }
        if (RE_LI_CIRCLE.test(s)) { marked = true; s = s.replace(RE_LI_CIRCLE, '').trim(); }
        if (RE_LI_PAREN.test(s)) { marked = true; numHead = true; s = s.replace(RE_LI_PAREN, '').trim(); }
        if (RE_LI_NUM.test(s)) { marked = true; numHead = true; s = s.replace(RE_LI_NUM, '').trim(); }
        if (s === before) break;
      }
      s = s.replace(/^\*\*(.+)\*\*$/, '$1').trim();
      if (!s) return;
      if (RE_CN_NUM.test(s)) { numHead = true; s = s.replace(RE_CN_NUM, '').trim(); if (!s) return; }

      /* 小标题判定：显式结构（## / 一、/ （1））直接认；裸行只在「像标签」时才认。
         例外：「有这些更香」虽以「有」开头，但确实是标题。 */
      const bare = !marked;
      const looksLabel = RE_HEAD_ANY.test(s) && s.length <= 12
        && !(RE_REQ_START.test(s) && !/(更香|加分)/.test(s));
      /* 「岗位要求：本科及以上学历」这类「标签 + 冒号 + 内容」整行也当标题：
         标题照常归位，冒号后的内容原样落桶，一个字都不丢。 */
      const mLabel = bare ? s.match(/^(.{2,10}?)[：:]\s*(.+)$/) : null;
      const labelHead = !!(mLabel && RE_HEAD_ANY.test(mLabel[1]) && !RE_REQ_START.test(mLabel[1]));
      /* 无符号裸行的启发式阈值必须压到 8 字以内：
         「拆成能落地的产品方案」这类半句（10 字、无标点、下一行是条目）
         曾经被误判成小标题而整条吞掉 —— 短标签才是标题。 */
      const isHead = mdHead || numHead || (bare && (looksLabel || labelHead
        || (s.length <= 8 && !/[。！？!?；;，,、：:]/.test(s) && !RE_REQ_START.test(s) && nextMarked(i))));
      if (isHead) {
        const m = s.match(/^(.{0,14}?)[：:]\s*(.+)$/);
        const label = m ? m[1].trim() : s;
        flush(); heads++;
        key = RE_HEAD_NICE.test(label) ? 'nice'
          : RE_HEAD_BENEFIT.test(label) ? 'benefit'
            : RE_HEAD_DUTY.test(label) ? 'duty' : 'must';
        if (m) cur = { text: m[2].trim() };                  /* 「加分项：有A」→ 标题+内容都不丢 */
        return;
      }
      /* 断行还原：上一行以句中标点结尾 → 这句还没说完，并回来；
         否则视为「上一行已是一条完整条目」。 */
      if (cur && !marked && (RE_END_MID.test(cur.text) || (cur.marked && !RE_END_SENT.test(cur.text)))) {
        /* 上一行「话没说完」才并回来，两种情形：
           ① 以句中标点结尾 —— 断行只是把一句话切开了，直接接上；
           ② 本来是列表项却没写完 —— 需要补一个逗号，例如
              「• 把模糊的用户场景」+「拆成能落地的产品方案」。
           表单里一行一条的写法（无符号、无标点）不满足任一条件，
           不会被合并，「一行一条 → 提交 → 再载入」往返无损。 */
        cur.text += RE_END_MID.test(cur.text) ? '' : (/[A-Za-z0-9]$/.test(cur.text) ? ' ' : '，');
        cur.text += s;
      } else { flush(); cur = { text: s, marked: marked }; }
    });
    flush();

    /* 引言只在「确实是一份完整 JD」时保留（≥2 个小标题）；否则前置内容
       就是普通任职要求，退回 must —— 避免把一列要求误当公司介绍。 */
    if (heads < 2) { b.must = b.lead.concat(b.must); b.lead = []; }
    /* 「 / 」并列项拆开（要求斜杠两侧有空格）；「AI/大模型」这类写法不受影响 */
    ['duty', 'must', 'nice', 'benefit'].forEach(k => {
      b[k] = b[k].flatMap(t => String(t).split(/\s+[／/]\s+/).map(x => x.trim()).filter(Boolean));
    });
    return { lead: b.lead, duty: b.duty, must: b.must, nice: b.nice, benefit: b.benefit, heads: heads };
  }

  /* 条目 → 一段自然行文：短句用「；」衔接，自带句末标点的保留原标点 */
  function paragraphize(items) {
    const arr = (Array.isArray(items) ? items : [items])
      .map(t => String(t == null ? '' : t).trim().replace(/[；;]+$/, '')).filter(Boolean);
    let out = '';
    arr.forEach(s => { out += (!out || RE_END_SENT.test(out) || RE_END_MID.test(out)) ? s : '；' + s; });
    if (out && !RE_END_SENT.test(out)) out += '。';
    return out;
  }

  /* 六维度 → JD 正文行：维度小标题（粗体）+ 一段自然行文 */
  const CN_DIM = ['一', '二', '三', '四', '五', '六', '七', '八'];
  function renderReqDims(dims) {
    const out = [];
    (Array.isArray(dims) ? dims : []).forEach((d, i) => {
      const items = (d && Array.isArray(d.items)) ? d.items : [];
      if (!items.length) return;
      out.push('**（' + (CN_DIM[i] || (i + 1)) + '）' + d.name + '**', paragraphize(items), '');
    });
    if (out.length) out.pop();
    return out.length ? out : ['任职要求待填写。'];
  }

  return { FUNCTIONS, INDUSTRY_CTX, detectFunction, detectJunior, pickDuties, industryDuty, extractKeywords, buildSkillUniverse, norm,
    parseReqText, paragraphize, renderReqDims };
});
</script>

  /* ============ 渲染并执行计划 ============ */
  async function run(planKey, host, opts = {}) {
    const plan = PLANS[planKey];
    if (!plan || !host) return;
    host.innerHTML = `
      <div class="callout" style="margin-top:0">
        <b>🧭 任务目标</b>：${plan.goal}<br>
        <span class="muted small">模型路由：${plan.model} · 共 ${plan.steps.length} 步 · 高风险步骤 ${plan.steps.filter(s => s.risk).length} 个</span>
      </div>
      <div id="planlist"></div>
      <div id="planfoot" class="small muted" style="margin-top:10px"></div>`;
    const list = host.querySelector('#planlist');
    const foot = host.querySelector('#planfoot');

    plan.steps.forEach((s, i) => {
      const d = document.createElement('div');
      d.className = 'plan-step pending';
      d.id = `ps-${planKey}-${i}`;
      d.innerHTML = `
        <div class="step-ico">${i + 1}</div>
        <div class="sbody">
          <div class="stitle">${s.intent}</div>
          <div class="smeta">
            <span>🔧 ${s.tool}</span>
            ${s.rule ? '<span style="color:var(--pur)">规则/代码（0 token）</span>' : ''}
            <span class="st">等待中</span>
          </div>
        </div>`;
      list.appendChild(d);
    });

    let totalMs = 0, totalTok = 0;
    for (let i = 0; i < plan.steps.length; i++) {
      const s = plan.steps[i];
      const el = host.querySelector(`#ps-${planKey}-${i}`);
      el.classList.remove('pending'); el.classList.add('run');
      el.querySelector('.st').textContent = '执行中…';
      await sleep(Math.max(320, opts.speed ? s.ms * 0.35 : s.ms));
      totalMs += s.ms; totalTok += s.tokens;

      // 高风险步骤：挂起等人工
      if (s.risk) {
        el.classList.remove('run'); el.classList.add('wait');
        el.querySelector('.step-ico').textContent = '!';
        el.querySelector('.st').innerHTML = '<span style="color:var(--yel)">⏸ 已挂起 · 等待人工审核</span>';
        el.querySelector('.sbody').insertAdjacentHTML('beforeend',
          `<div class="sout" style="border-color:rgba(245,185,66,.4)">${esc(s.out)}</div>
           <div class="scanwarn">🛡️ 该工具被标记为「需人工审核」，Agent 已停止执行并进入审核队列。

        foot.innerHTML = `<span style="color:var(--yel)">任务状态：waiting_approval</span> · 已耗时 ${(totalMs / 1000).toFixed(1)}s · 已消耗 ${totalTok.toLocaleString()} tokens · 点击「去审核」处理`;
        if (opts.onGate) opts.onGate(host, i);

      el.querySelector('.step-ico').textContent = '✓';
      el.querySelector('.st').innerHTML = `<span style="color:var(--grn)">✓ ${s.ms}ms</span>${s.tokens ? ` · <span class="muted">${s.tokens} tok</span>` : ''}`;

      if (opts.onStep) opts.onStep(i);
    }
    foot.innerHTML = `<span style="color:var(--grn)">任务状态：done</span> · 总耗时 ${(totalMs / 1000).toFixed(1)}s · 共消耗 ${totalTok.toLocaleString()} tokens ≈ ¥${(totalTok * 0.000004).toFixed(3)}`;
    if (opts.onDone) opts.onDone();
    return { status: 'done', ms: totalMs, tokens: totalTok };
  }

    [/试用期.{0,6}(不合格|不通过).{0,6}不(支付|发).{0,2}工资/, '试用期不发工资', '违法：试用期工资不得低于约定工资的 80%，且不得低于当地最低工资标准。', '改为「试用期工资按约定标准的 100% 发放」'],
    [/(女员工|女职工).{0,10}(入职.{0,4}不|承诺.{0,4}不)生育|三年内.{0,4}不得生育/, '限制生育', '限制生育权违反《妇女权益保障法》，此类约定无效。', '整句删除']
  ];
  function scanJD(text) {
    const flagged = [], legal = [];
    String(text || '').split('\n').forEach((line, i) => {
      BIAS_RULES.forEach(([re, word, why, fix]) => { if (re.test(line)) flagged.push({ word, why, fix, line: i + 1, hit: line.trim().slice(0, 60) }); });
      LEGAL_RULES.forEach(([re, word, why, fix]) => { if (re.test(line)) legal.push({ word, why, fix, line: i + 1, hit: line.trim().slice(0, 60) }); });
    });
    return { flagged, legal };
  }

  function generateJD(input) {
    const title = (input.title || '').trim() || '待填写岗位';
    const industry = input.industry || '通用';
    const dept = input.dept || '待填写部门';
    /* 任职要求：在已填内容基础上，按六维度扩充（同后端 engine.js 规则） */
    const reqs = expandReqs({ title, industry, dept, years: input.years, eduRank: input.eduRank, must: input.must, nice: input.nice });
    /* 岗位职责同样「职能优先」：职责模板由 expandReqs 按职能族给出，识别不出才退回行业模板。
       若 HR 整段粘进来一份 JD 且写了「你会做什么」，以 HR 自己写的为准（≥3 条不再叠加模板）。 */
    const uDuty = (reqs.userDuties || []).map(d => String(d).replace('{title}', title));
    const tplDuty = (reqs.duties || (JD_DUTY_TPL[industry] || JD_DUTY_TPL['通用']))
      .map(d => d.replace('{title}', title).replace('{dept}', dept));
    const duties = !uDuty.length ? tplDuty
      : uDuty.length >= 3 ? uDuty
        : uDuty.concat(tplDuty.slice(0, Math.max(0, 6 - uDuty.length)));
    /* 引言：粘贴进来的 JD 首段（「我们在找一个…那我们在等你。」）*/
    const leadParas = (reqs.lead || []).slice(0, 3);
    const leadText = leadParas.length ? (window.ReqLib && window.ReqLib.paragraphize ? window.ReqLib.paragraphize(leadParas) : leadParas.join('')) : '';
    const benefits = (input.benefits && input.benefits.length) ? input.benefits
      : ['依法足额缴纳五险一金', '弹性工作制（10:00 前到岗，当日工作满 8 小时）', '带薪年假、法定节假日按国家规定执行'];
    const jd = [
      `# ${title}`, '',
      `**所属部门**：${dept}　|　**工作地点**：北京　|　**招聘人数**：${input.headcount || 1} 人`,
      `**薪资范围**：${input.salary || '面议'}　|　**岗位类型**：全职　|　**行业**：${industry}`, '',
      ...(leadText ? [leadText, ''] : []),
      '## 一、岗位职责',
      ...duties.map((d, i) => `${i + 1}. ${d}`), '',
      '## 二、任职要求',
      ...renderReqs(reqs.dims), '',
      '## 三、加分项',
      (reqs.nice.length ? (window.ReqLib && window.ReqLib.paragraphize ? window.ReqLib.paragraphize(reqs.nice) : reqs.nice.join('；') + '。') : '暂无特别加分项，如有相关经历欢迎在面试中说明。'), '',
      '## 四、我们提供',
      ...benefits.map(b => `- ${b}`), '',
      '## 五、平等就业机会声明',
      '本公司为所有求职者提供平等就业机会。招聘与录用不因性别、年龄、民族、宗教信仰、婚育状况、户籍、地域、院校背景、身体残障等因素而区别对待。',
      '我们承诺：本岗位描述不含任何歧视性用语，所有录用决定均基于岗位胜任力作出。'
    ].join('\n');
    const scan = scanJD(jd);
    /* 打分关键词：用与后端同源的抽取逻辑（职能族 ∪ 行业词库），保证离线/在线抽出的词一致 */
    const keywords = window.ReqLib
      ? window.ReqLib.extractKeywords([...reqs.must, ...reqs.nice], INDUSTRY_CORE)
      : [];
    return { jd, flagged: scan.flagged, legal: scan.legal, must: reqs.must, soft: reqs.soft, nice: reqs.nice, dims: reqs.dims,
      fnKey: reqs.fnKey, fnName: reqs.fnName, reqSource: reqs.source, junior: !!reqs.junior,
      keywords, industry, title };
  }

  /* ============ 简历打分（规则 + 关键词模拟） ============ */
  function scoreResume(text, jobMust) {
    const t = (text || '').toLowerCase();
    const kw = {
      skill: ['java', 'spring', 'spring boot', 'spring cloud', 'mysql', 'redis', 'kafka', '微服务', '分布式', '高并发', 'jvm', 'dubbo', '架构'],
      plus: ['开源', 'github', '专利', '大厂', '团队管理', '技术负责人', 'star', '内推'],
      biz: ['电商', '交易', '订单', '支付', '金融', 'saas', '供应链']
    };
    const hit = k => kw[k].filter(w => t.indexOf(w) > -1);
    const skillHits = hit('skill'), plusHits = hit('plus'), bizHits = hit('biz');

    const m = t.match(/(\d+(\.\d+)?)\s*年/);
    const years = m ? parseFloat(m[1]) : 0;
    const eduRank = /博士|硕士|研究生/.test(t) ? 3 : /本科|学士/.test(t) ? 2 : /大专|专科/.test(t) ? 1 : 0;
    const needEdu = /本科/.test(jobMust || '') ? 2 : 0;
    const needYears = (jobMust || '').match(/(\d+)\s*年/);

    // 硬性门槛：规则判定，不调模型
    if (needYears && years && years < parseFloat(needYears[1]))
      return { gate: true, reason: `工作年限 ${years} 年 < 岗位要求 ${needYears[1]} 年（规则判定，未调用模型）`, score: 0, grade: 'no', dims: [], hits: { skillHits, plusHits, bizHits } };
    if (eduRank && eduRank < needEdu)
      return { gate: true, reason: '学历不满足硬性要求（规则判定）', score: 0, grade: 'no', dims: [], hits: { skillHits, plusHits, bizHits } };

    const s1 = Math.min(40, skillHits.length * 4.2);
    const s2 = Math.min(30, bizHits.length * 7 + 8);
    const s3 = years >= 5 ? 13 : years >= 3 ? 11 : 8;
    const s4 = Math.min(15, plusHits.length * 5);
    const total = Math.round(s1 + s2 + s3 + s4);
    const dims = [
      { dim: '技能匹配', score: Math.round(s1), max: 40, ev: `命中技术关键词 ${skillHits.length} 项：${skillHits.slice(0, 6).join('、') || '无'}` },
      { dim: '业务匹配', score: Math.round(s2), max: 30, ev: `命中业务关键词 ${bizHits.length} 项：${bizHits.join('、') || '未体现相关业务经验'}` },
      { dim: '稳定性', score: s3, max: 15, ev: years ? `总工作年限约 ${years} 年` : '简历未体现工作年限，记 0 分并说明' },
      { dim: '加分项', score: Math.round(s4), max: 15, ev: plusHits.join('、') || '无开源/专利/大厂/管理经验' }
    ];
    return { gate: false, score: total, grade: total >= 78 ? 'strong' : total >= 60 ? 'ok' : 'no', dims, hits: { skillHits, plusHits, bizHits } };
  }

  /* ============ 员工自助问答引擎 ============ */
  const KB = [
    { k: ['年假', '调休', '假期余额', '剩几天'], route: 'personal', src: '《假期管理制度》v2.6 第 3 章',
      eff: '2026-04-01', ans: days => `你当前年假余额为 ${days} 天（其中 2026 年度剩余 3.5 天 + 上年度结转 2.0 天，结转部分需在本年度 12 月 31 日前使用）。
计算口径：入职满 1 年享受 10 天年假，按在职月份折算；上年度未休部分最多结转 5 天。
（以上天数来自 HR 系统实时数据，非文档说明）` },
    { k: ['考勤', '打卡', '迟到', '加班'], route: 'policy', src: '《考勤与加班管理办法》v2.1 第 2、4 章', eff: '2026-05-01',
      ans: () => `公司实行弹性工作制：每个工作日 10:00 前打卡到岗，当日工作满 8 小时即可。
加班需提前在系统提交申请，经直属上级审批后生效；加班可申请调休，调休需在 3 个月内使用。
每月迟到累计 3 次以上将影响当月考勤考核评分。` },
    { k: ['社保', '公积金', '缴纳', '基数', '五险'], route: 'policy', src: '《社保公积金缴纳说明（北京）》v1.9 第 1、2 章', eff: '2026-07-01',
      ans: () => `公司按北京市规定足额缴纳五险一金，缴纳基数为本人上年度月平均工资（新入职员工按首月工资）。
每年 7 月随北京市社平工资调整同步调基。
公积金缴存比例为 12%（公司与个人同比例），每月 15 日前完成当月缴纳。
户口在外地不影响在北京参保，但需注意社保转移衔接（可在「随申办」或北京人社渠道办理）。` },
    { k: ['报销', '发票', '差旅', '出差'], route: 'policy', src: '《员工手册（2026 修订版）》v3.2 第 6 章', eff: '2026-01-01',
      ans: () => `报销流程：在 OA 提交报销单 → 上传发票原件照片 → 直属上级审批 → 财务复核 → 每月 25 日统一打款。
差旅需提前提交出差申请，未经审批的差旅费用原则上不予报销。
发票抬头请填写公司全称，个人抬头发票无法报销。` },
    { k: ['试用期', '转正'], route: 'policy', src: '《试用期与转正管理规定》v1.4 第 2、3 章', eff: '2026-03-01',
      ans: () => `试用期为 3 个月（特殊岗位可约定 6 个月）。试用期工资按约定标准的 100% 发放。
转正流程：试用期结束前 15 天，系统自动提醒直属上级发起转正考核；考核通过后次月 1 日转正。
如因客观原因需要延长试用期，须在到期前 7 天由直属上级提出申请并经 HRD 审批，且延长后总时长不得超过法定上限。` }
  ];
  const REFUSE = [
    { k: ['仲裁', '起诉', '赔偿', '劳动纠纷', '违法解除', '律师', '劳动法'], type: '法律意见',
      msg: '这个问题涉及劳动关系法律判断，超出我的授权范围，我不能给出意见（避免给你造成误导）。已为你转接 HR，并同步法务同事跟进。' },
    { k: ['工资', '薪资', '涨薪', '谈薪', '加薪'], type: '薪酬个案',
      msg: '薪资调整属于个案沟通事项，需要结合你的岗位、绩效与公司政策综合判断，不适合由我直接回答。已为你转接你的 HRBP，通常在 1 个工作日内联系你。' },
    { k: ['张三', '李四', '同事', '别人的', '某某'], type: '他人隐私',
      msg: '我只能查询你本人的数据，无法查询或推算其他同事的任何信息（这是制度与法律的硬性要求，不是权限设置问题）。如需了解相关制度，我可以为你解释。' }
  ];

  function classify(q) {
    if (REFUSE.some(r => r.k.some(k => q.indexOf(k) > -1))) return 'refuse';
    if (/我.*(年假|调休|余额|几天|假期)/.test(q) || /还剩/.test(q)) return 'personal';
    if (KB.some(b => b.k.some(k => q.indexOf(k) > -1))) return 'policy';
    return 'nomatch';
  }

  function answer(q) {
    const route = classify(q);
    if (route === 'refuse') {
      const r = REFUSE.find(r => r.k.some(k => q.indexOf(k) > -1));
      return { route: 'escalated', type: r.type, text: r.msg,
        foot: '已转人工 · 记录到「未解答问题」不适用（属于授权范围外，已按规则分流）',
        cites: [] };
    }
    if (route === 'personal') {
      const b = KB.find(x => x.route === 'personal');
      return { route: 'personal_data', text: b.ans('3.5'),
        cites: [{ t: b.src, eff: b.eff, note: '数字来源：HR 系统实时查询（权威事实）' }],
        badge: '🔎 已查询 HR 系统实时数据' };
    }
    if (route === 'policy') {
      const b = KB.find(x => x.k.some(k => q.indexOf(k) > -1));
      return { route: 'policy', text: b.ans(),
        cites: [{ t: b.src, eff: b.eff, note: '回答完全基于该文档，未做任何推断' }],
        badge: '📚 已检索企业知识库' };
    }
    return { route: 'no_match', text: `我在公司制度文档里没有找到与「${q}」相关的内容，为避免给你错误信息，我不做推测回答。
你可以选择：① 点击下方「转人工」由 HR 答复；② 换个说法再问一次。
你这次的问题已被记录，HR 会据此补充知识库。`,
      cites: [], badge: '⚠️ 知识库无匹配（相似度低于阈值 0.55）' };
  }

  return { PLANS, run, generateJD, expandReqs, renderReqs, INDUSTRY_CORE, INDUSTRY_REQ, scoreResume, answer, classify, sleep };
})();

<script>/* ===========================================================
   HR-Agent OS · 应用主体：导航 + 路由 + 页面渲染
   =========================================================== */
(function () {
  const D = window.DB, A = window.Agent;

  /* ============ 导航结构（对应 PRD 第七部分） ============
     `perm` = 显示该页所需的能力（字符串或数组，数组为「满足其一」）。
     为什么要在前端也标一遍：后端已经按能力裁剪了数据，前端这一层是**界面减负**——
     员工登录后不该看到一个点进去全是 403 的菜单。它不承担安全职责，
     安全由服务端保证（即使手工改 URL 强行进入，数据依然是空的/403）。
     perm 缺省 = 所有已登录角色可见。 */
  const NAV = [
    { group: '', items: [{ id: 'dashboard', ico: '🏠', name: '工作台' }] },
    { group: '智能体中心', items: [
      { id: 'jd', ico: '📝', name: '招聘 Agent · JD 工作台', sub: true, perm: 'job:write' },
      { id: 'screen', ico: '🎯', name: '招聘 Agent · 简历筛选台', sub: true, perm: 'screen:run' },
      { id: 'invite', ico: '📨', name: '招聘 Agent · 邀约与调度', sub: true, perm: 'interview:schedule' },
      { id: 'interview', ico: '🎤', name: '招聘 Agent · 面试辅助', sub: true, perm: 'interview:read' },
      { id: 'offer', ico: '📄', name: '招聘 Agent · Offer 前置', sub: true, perm: 'offer:read' },
      { id: 'onboarding', ico: '🔄', name: '入转调离 Agent', perm: 'employee:read' },
      { id: 'selfservice', ico: '💬', name: '员工自助 Agent', perm: ['self:read', 'report:read'] },
      { id: 'reports', ico: '📊', name: '人力报表 Agent', perm: 'report:read' },
      { id: 'orchestrate', ico: '🧩', name: 'Agent 编排', perm: 'job:write' }
    ]},
    { group: '人才与员工', items: [
      { id: 'jobs', ico: '📋', name: '岗位管理（可自建）', perm: 'job:read' },
      { id: 'candidates', ico: '👥', name: '候选人库', perm: 'candidate:read' },
      { id: 'employees', ico: '🪪', name: '员工档案', perm: 'employee:read' }
    ]},
    { group: '审核与风控', items: [
      { id: 'approvals', ico: '✋', name: '审核中心', cnt: 3, perm: 'approval:read' },
      { id: 'risks', ico: '🚨', name: '风险拦截记录', perm: 'audit:read' }
    ]},
    { group: '权限与合规', items: [
      { id: 'permissions', ico: '🔐', name: '角色与权限', perm: 'report:read' },
      { id: 'audit', ico: '📜', name: '操作审计日志', perm: 'audit:read' },
      { id: 'privacy', ico: '🛡️', name: '隐私与反歧视', perm: 'governance:read' }
    ]},
    { group: '系统设置', items: [
      { id: 'integrations', ico: '🔌', name: '第三方集成', perm: 'admin:policy' },
      { id: 'kb', ico: '📚', name: '知识库管理' },
      { id: 'model', ico: '⚙️', name: '模型与用量', perm: 'metrics:read' }
    ]},
    { group: '产品底座', items: [
      { id: 'foundation', ico: '🧱', name: 'Agent 底座能力' },
      { id: 'about', ico: '❓', name: '关于本原型' }
    ]}
  ];

  /** 当前身份是否可看某页：离线演示态（没有会话）一律放行，保证断网可完整演示 */
  function canSee(item) {
    if (!item.perm) return true;
    if (!LIVE.on || !AUTH.me) return true;
    const need = Array.isArray(item.perm) ? item.perm : [item.perm];
    const have = AUTH.me.abilities || [];
    return need.some(n => have.includes(n) || have.includes('*'));
  }

  /** 当前身份能不能做某个动作（用于按钮级守卫）。
   *  为什么按钮也要判：只靠点下去弹 403 是「事后报错」，不是权限设计。
   *  招聘专员点开审核中心看到「✓ 批准并执行」，点下去必 403 —— 演示时最难看的就这种。
   *  注意这只是**体验层**；真正的拦截永远在服务端，前端守卫从不承担安全职责。 */
  function canDo(ability) {
    if (!LIVE.on || !AUTH.me) return true;          // 离线演示态：全部放行
    const have = AUTH.me.abilities || [];
    return have.includes(ability) || have.includes('*');
  }
  /** 离线演示用的面试样例（真实后端态由 bootstrap.interviews 提供，不用这份） */
  const DEMO_INTERVIEWS = [
    { id: 'D1', candidate: '王思远', job: '高级 Java 工程师', round: 1, mode: '线上', at: '2026-09-25 10:00', durationMin: 60, interviewer: '王磊', interviewerTitle: '后端负责人', status: 'completed', resultLabel: '通过' },
    { id: 'D2', candidate: '陈书瑶', job: '高级 Java 工程师', round: 1, mode: '现场', at: '2026-09-26 14:00', durationMin: 90, interviewer: '王磊', interviewerTitle: '后端负责人', status: 'scheduled', resultLabel: '' }
  ];
  const DEMO_OFFERS = [
    { id: 'OF-1', candidate: '赵一诺', job: '高级 Java 工程师', salary: 32000, probationMonths: 3, reportDate: '2026-11-02', status: 'pending_approval', statusLabel: '待审批', createdBy: '王强', checks: [] }
  ];

  const state = { page: 'dashboard', q: '', collapsed: false, jobId: null, jobForm: null,
    /* 最近一次筛选运行的真实模型用量（null = 还没跑过）。
       只由服务端返回的 steps 汇总而来；规则模式下恒为 0。绝不本地估算。 */
    runTokens: null };

  /* ---------- 当前岗位（不再写死「高级 Java 工程师」） ---------- */
  function curJob() { return D.jobs.find(x => x.id === state.jobId) || D.jobs[0] || null; }
  function setJob(id) { state.jobId = id; try { localStorage.setItem('hr.jobId', id); } catch (e) {} }
  function initJobSelection() {
    let saved = null;

  /* 离线兜底：无后端时由内置 Agent 生成（与后端 engine.js 同源规则：六维度扩充 + 真合规扫描） */
  function offlineGenJD(p) {
    const r = A.generateJD({ title: p.title, dept: p.dept, industry: p.industry, years: p.years, eduRank: p.eduRank,
      must: p.must, nice: p.nice, salary: p.salary, headcount: p.headcount, benefits: p.benefits });
    return { jd: r.jd, mustHave: r.must, niceHave: r.nice, softHave: r.soft, dims: r.dims,
      fnKey: r.fnKey, fnName: r.fnName, reqSource: r.reqSource,
      keywords: r.keywords || [], scan: { flagged: r.flagged || [], legal: r.legal || [] },
      blockPublish: ((r.flagged || []).length + (r.legal || []).length) > 0 };

  /* ---- JD 正文渲染：把 Markdown 子集转成 HTML（零依赖，离线可用） ----
     为什么要渲染而不是直接显示原文：JD 正文含 # / ## / ** 标记，
     直接当纯文本输出会出现裸的 `**（二）工作经验**`，看起来像数据错乱。
     安全约定：整行先 esc()，再做行内加粗替换，用户输入不会被当 HTML 执行。 */
  function inlineBold(s) { return s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
  function renderJD(md) {
    const out = [];
    String(md || '').split('\n').forEach(raw => {
      const line = raw.replace(/\s+$/, '');
      if (!line.trim()) { out.push('<div class="jd-gap"></div>'); return; }
      const t = esc(line);
      let m;
      if ((m = line.match(/^###\s+(.*)$/))) { out.push(`<div class="jd-h3">${esc(m[1])}</div>`); return; }
      if ((m = line.match(/^##\s+(.*)$/))) { out.push(`<div class="jd-h2">${esc(m[1])}</div>`); return; }
      if ((m = line.match(/^#\s+(.*)$/))) { out.push(`<div class="jd-h1">${esc(m[1])}</div>`); return; }
      if ((m = line.match(/^\*\*(.+)\*\*$/))) { out.push(`<div class="jd-h3">${esc(m[1])}</div>`); return; }
      if ((m = line.match(/^[-*]\s+(.*)$/))) { out.push(`<div class="jd-li">· ${inlineBold(esc(m[1]))}</div>`); return; }
      if (/^\d+[.、]\s+/.test(line)) { out.push(`<div class="jd-li">${inlineBold(t)}</div>`); return; }
      out.push(`<div class="jd-p">${inlineBold(t)}</div>`);
    });
    return out.join('') || '<div class="jd-p muted">（暂无内容）</div>';
  }

  /* ============ 本地全栈模式（server/ 目录启动后自动激活） ============
     v0.10.0 起后端启用真实身份认证（strict 模式）：
     - 令牌来自 /api/auth/login，用 Bearer 头发送，同时接受服务端下发的 HttpOnly Cookie。
     - 不再发送可伪造的 X-User 头（strict 模式下后端也完全不读它）。
     - 401 会中断当前操作并弹出登录层；离线态（file:// 打开）不触发任何网络请求，
       继续使用内置演示数据，保证「断网也能演示」。

  const LIVE = { on: false, mode: 'rule', authMode: 'legacy' };

  try { AUTH.token = localStorage.getItem('hr_token') || null; } catch (e) { /* 隐私模式禁 localStorage */ }
  function setToken(t) {
    AUTH.token = t || null;
    try { t ? localStorage.setItem('hr_token', t) : localStorage.removeItem('hr_token'); } catch (e) { }

  async function apiFetch(method, url, body, opts) {
    const headers = { 'Content-Type': 'application/json' };
    if (AUTH.token) headers['Authorization'] = 'Bearer ' + AUTH.token;
    const r = await fetch(url, {
      method, headers, credentials: 'include',
      body: body ? JSON.stringify(body) : undefined
    });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401 && !/\/api\/auth\//.test(url)) {
      showAuthGate('会话已失效或未登录，请重新登录后继续。');
      throw Object.assign(new Error('未登录'), { status: 401, data: j, unauthenticated: true });
    }
    if (r.status === 403) {
      const msg = (j.error && j.error.message) || '数据范围权限不足';
      toast('🛑 403 ' + msg, 'err');
      throw Object.assign(new Error(msg), { status: 403, data: j });
    }
    if (!r.ok) throw Object.assign(new Error((j.error && j.error.message) || j.msg || r.status), { status: r.status, data: j });
    return j;
  }

       注：后端已删除 AUTH_MODE=legacy 分支（留开关就是留后门），所以这里不再有伪身份路径。 */
    let health = null;

  /* ============ SVG 图表 ============ */
  function funnelChart(data) {
    const max = data[0].n, rowH = 34, pad = 8, W = 660, barMax = 300;
    let svg = `<svg viewBox="0 0 ${W} ${data.length * rowH + 44}" style="width:100%;height:auto">`;
    svg += `<text x="0" y="16" fill="#6f7a8d" font-size="11">阶段（倒序无需，漏斗自上而下）</text>`;
    svg += `<text x="${W - 4}" y="16" fill="#6f7a8d" font-size="11" text-anchor="end">人数 / 转化率</text>`;
    data.forEach((d, i) => {
      const y = 30 + i * rowH;
      const w = Math.max(26, barMax * d.n / max);
      const prev = i ? data[i - 1].n : d.n;
      const rate = i ? ((d.n / prev) * 100).toFixed(1) + '%' : '—';
      svg += `<rect x="0" y="${y}" width="${w}" height="22" rx="5" fill="${d.color}" opacity="0.85"/>`;
      svg += `<text x="8" y="${y + 15}" fill="#0d0f14" font-size="11.5" font-weight="600">${esc(d.stage)}</text>`;
      svg += `<text x="${w + 10}" y="${y + 15}" fill="#e7eaf1" font-size="12" font-weight="600">${d.n}</text>`;
      svg += `<text x="${w + 46}" y="${y + 15}" fill="#6f7a8d" font-size="11.5">${rate}</text>`;
      svg += `<rect x="470" y="${y + 3}" width="${(d.n / max) * 170}" height="16" rx="4" fill="${d.color}" opacity="0.28"/>`;
      svg += `<line x1="0" y1="${y + 27}" x2="${W}" y2="${y + 27}" stroke="#262c39" stroke-width="1"/>`;
    });
    return svg + '</svg>';
  }

            <textarea class="i" id="jfMust" rows="4" placeholder="每行一条，例如：&#10;3 年以上采购经验&#10;熟悉供应商开发与成本管控">${esc((d.mustHave || []).join('\n'))}</textarea></div>
          <div class="field"><label class="f">加分项</label>
            <textarea class="i" id="jfNice" rows="2" placeholder="有精益生产项目经验，熟悉 ERP 系统">${esc((d.niceHave || []).join('，'))}</textarea></div>
          <div class="callout" style="margin:0 0 10px">
            ✨ <b>只写一条也能生成完整任职要求</b>：点下面「让 Agent 生成 JD 草稿」，Agent 会把你已填的内容<b>原样保留</b>，
            再按<b>专业技能 / 工作经验 / 学历背景 / 综合素质 / 软技能</b>五个维度补齐，加分项同步扩充。
          </div>
          <div class="field"><label class="f">JD 正文（留空 = 保存时按行业模板自动生成）</label>
            <textarea class="i" id="jfJd" rows="5" placeholder="留空即可；也可以粘贴你自己写好的 JD 覆盖">${esc(d.jd || '')}</textarea></div>
        </div>
      </div>
      <div style="display:flex;gap:9px;justify-content:flex-end;align-items:center">
        <span class="small muted" id="jfHint" style="margin-right:auto"></span>
        <button class="btn ghost" data-act="cancelJobForm">取消</button>
        <button class="btn" data-act="genJobJD">🤖 让 Agent 生成 JD 草稿</button>
        <button class="btn primary" data-act="saveJob">💾 保存岗位</button>
      </div>
    </div>`;
  }

  PAGES.jobs = () => {
    const rows = D.jobs.map(j => {
      const isCur = j.id === state.jobId;
      return `<tr${isCur ? ' style="background:rgba(122,169,255,.07)"' : ''}>
        <td class="name">${esc(j.title)}${isCur ? ' <span class="tag g">当前</span>' : ''}
          <div class="small muted">${esc(j.id)} · ${esc(j.salary || '薪资面议')} · 编制 ${j.headcount || 1} 人 · ${esc(j.openedAt || '')} 开岗</div></td>
        <td><span class="tag">${esc(j.industry || '未标注')}</span></td>
        <td class="small">${esc(j.dept || '')}</td>
        <td class="small">${j.mustYears || 0} 年及以上 · ${EDU_NAME[j.mustEduRank == null ? 0 : j.mustEduRank] || '不限'}
          <div class="small muted">${(j.mustHaveText || []).slice(0, 2).join(' / ') || '未填写'}</div></td>
        <td>${j.applicants || 0}<div class="small muted">${j.pending ? '待评分 ' + j.pending : (j.applicants ? '已全部评分' : '暂无简历')}</div></td>
        <td>${(j.keywords && j.keywords.length) ? j.keywords.slice(0, 3).map(k => `<span class="tag">${esc(k)}</span>`).join(' ') + (j.keywords.length > 3 ? ` <span class="small muted">+${j.keywords.length - 3}</span>` : '') : '<span class="small muted">未配置</span>'}</td>
        <td>${j.status === '招聘中' ? '<span class="tag g">招聘中</span>' : `<span class="tag y">${esc(j.status)}</span>`}</td>
        <td style="white-space:nowrap">
          <button class="btn sm" data-act="viewJob" data-id="${j.id}">看 JD</button>
          <button class="btn sm" data-act="editJob" data-id="${j.id}">编辑</button>
          <button class="btn sm" data-act="gotoScreen" data-id="${j.id}">去筛选</button>
          <button class="btn sm danger" data-act="delJob" data-id="${j.id}">${(j.applicants || 0) > 0 ? '关闭' : '删除'}</button>
        </td></tr>`;
    });

    return `
    <div class="page-head"><h2>岗位管理</h2>
      <p>这是<b>岗位的唯一来源</b>——筛选 Agent 的硬性门槛、打分关键词、JD 都由这里驱动，不再写死任何具体岗位。<br>
      支持自己填写任意行业、任意岗位；保存后到「简历筛选台」切换过去即可运行。</p></div>

    ${state.jobForm ? jobFormHtml() : ''}

    <div class="card" style="margin-bottom:14px">
      <div class="row" style="align-items:center">
        <div><span class="card-sub">共 ${D.jobs.length} 个岗位 · 覆盖 ${[...new Set(D.jobs.map(x => x.industry || '未标注'))].length} 个行业</span></div>
        <div style="flex:1"></div>
        ${state.jobForm ? '' : `<button class="btn primary" data-act="newJob">➕ 新建岗位</button>`}
      </div>
      <div class="chip-row" style="margin-top:6px">
        ${[...new Set(D.jobs.map(x => x.industry || '未标注'))].map(i => `<span class="tag">${esc(i)} ${D.jobs.filter(x => (x.industry || '未标注') === i).length}</span>`).join('')}
      </div>
    </div>

    <div class="card pad0">
      <div class="card-h"><h3>岗位列表</h3><span class="spacer"></span>
        <span class="card-sub">按开岗时间倒序 · ${LIVE.on ? '写入后端 SQLite（真实持久化）' : '离线演示（刷新即复原）'}</span></div>
      <div style="padding:0 16px 14px">
        ${D.jobs.length ? tbl(['岗位', '行业', '部门', '硬性要求', '简历', '打分关键词', '状态', '操作'], rows)
        : '<div class="tbl-empty">还没有岗位，点右上角「➕ 新建岗位」开始。</div>'}
      </div>
    </div>`;
  };

  /* ---- 邀约与调度 ----
     这一页以前是纯静态演示（「面试官忙闲日历」写死了王磊的时间），
     现在候选人名单、面试记录、面试官名录都来自真实数据，
     「安排面试」是真的写库并推进阶段。离线态退回 DEMO_* 样例，保证断网也能演示。 */
  PAGES.invite = () => {
    const IV = LIVE.on ? (D.interviews || []) : DEMO_INTERVIEWS;
    const allC = D.candidates || [];
    const list = allC.filter(c => ['已邀约', '待复试', '待面试'].includes(c.stage));
    const openIv = IV.filter(i => i.status === 'scheduled' || i.status === 'in_progress');
    const canSchedule = canDo('interview:schedule');
    const itvNames = D.interviewers || [];

    return `
    <div class="page-head"><h2>招聘 Agent · 邀约与调度</h2>
      <p>HRD 批准写回后候选人进入「已邀约」，由招聘专员<b>排期</b>把人推进到面试官手里。
      Agent 只做时间建议与文案草稿，<b>「排期」这个动作由人确认</b> —— 这是对面试官时间的尊重，也是责任划分。</p></div>

    <div class="row">
      <div class="col" style="flex:1.3;min-width:340px">
        <div class="card pad0">
          <div class="card-h"><h3>待安排面试</h3><span class="spacer"></span>
            <span class="card-sub">${LIVE.on ? '实时读自 candidates.stage' : '离线演示数据'}</span></div>
          <div style="padding:0 16px 14px">${tbl(['候选人', '岗位', '当前阶段', 'AI 评分', '操作'],
      list.map(c => `<tr>
              <td class="name">${esc(c.name)}</td>
              <td class="small">${esc(c.job || '')}</td>
              <td>${stageTag(c.stage)}</td>
              <td>${c.score != null ? `<span class="tag ${scoreColor(c.score)}">${c.score}</span>` : '<span class="small muted">—</span>'}</td>
              <td>${canSchedule
        ? `<button class="btn sm" data-act="schedForm" data-id="${esc(c.id)}">📅 安排面试</button>`
        : '<span class="small muted">🔒 需 interview:schedule</span>'}</td>
            </tr>`),
      '暂无「已邀约」候选人：先到筛选台跑 Agent，再让 HRD 批准写回。')}</div>
        </div>

        <div class="card pad0" style="margin-top:14px">
          <div class="card-h"><h3>面试记录</h3><span class="spacer"></span>
            <span class="card-sub">${openIv.length} 场待进行 · 共 ${IV.length} 条</span></div>
          <div style="padding:0 16px 14px">${tbl(['候选人', '轮次', '时间', '形式', '面试官', '状态'],
        IV.map(i => `<tr>
              <td class="name">${esc(i.candidate || '')}<div class="small muted">${esc(i.job || '')}</div></td>
              <td class="small">第 ${esc(i.round)} 轮</td>
              <td class="small mono">${esc(i.at || '—')}</td>
              <td class="small">${esc(i.mode || '')} · ${esc(i.durationMin || 60)} 分钟</td>
              <td class="small">${esc(i.interviewer || '')}<div class="small muted">${esc(i.interviewerTitle || '')}</div></td>
              <td>${i.status === 'completed' ? `<span class="tag g">已完成</span> <span class="small muted">${esc(i.resultLabel || '')}</span>`
          : i.status === 'in_progress' ? '<span class="tag y">面试中</span>'
            : i.status === 'cancelled' ? '<span class="tag n">已取消</span>'
              : '<span class="tag b">待面试</span>'}</td>
            </tr>`), '还没有面试安排：在上面点「📅 安排面试」。')}</div>
        </div>
      </div>

      <div class="col" style="flex:1;min-width:290px">
        <div class="card">
          <div class="card-h"><h3>面试官名录</h3><span class="spacer"></span><span class="card-sub">真实账号 · 独立角色</span></div>
          ${itvNames.length
        ? `<ul class="list-dot">${itvNames.map(i => `<li><b>${esc(i.name)}</b>
                <span class="small muted">${esc(i.title || '')} · ${esc(i.dept || '')} · ${esc(i.id)}</span></li>`).join('')}</ul>`
        : `<p class="small muted" style="margin:0 0 8px">${LIVE.on
          ? '当前角色没有 interview:schedule 能力，服务端未返回面试官名录（这是权限生效，不是加载失败）。'
          : '离线演示态：登录后可看到真实面试官账号。'}</p>`}
          <div class="hr-note"><b>面试官是独立角色</b>：只能读写属于自己的那场面试，看不到别人的面试、也看不到审批流。
          这条规则在服务端生效 —— 前端根本没有「看不到」这个状态，是服务端压根没把数据发过来。</div>
        </div>

        <div class="card" style="margin-top:14px">
          <div class="card-h"><h3>排期规则（代码约束，非模型判断）</h3></div>
          <ul class="list-dot">
            <li>一个人同时只能有 <b>1 场未完成的面试</b> —— 需要改约就先取消，取消会把阶段退回</li>
            <li>同一候选人 <b>第 1 轮通过 → 待复试</b>，第 2 轮通过才进入「待发offer」</li>
            <li>时间必须写成 <span class="mono">YYYY-MM-DD HH:MM</span>，模糊写法一律拒绝（不猜时间）</li>
            <li>取消面试会留下审计，但<b>不占用轮次号</b>，避免「取消一次就少一次复试」</li>
          </ul>
        </div>

        <div class="card" style="margin-top:14px">
          <div class="card-h"><h3>更新状态后的下一站</h3></div>
          <div class="tl">
            <div class="tl-item ok"><div class="tt">已邀约 → 待面试</div><div class="tb">招聘专员排期（本页）</div></div>
            <div class="tl-item ok"><div class="tt">待面试 → 面试中</div><div class="tb">面试官点「开始面试」</div></div>
            <div class="tl-item ok"><div class="tt">面试中 → 待复试 / 待发offer</div><div class="tb">面试官提交结论（人给的结论，Agent 不产出）</div></div>
            <div class="tl-item ok"><div class="tt">待发offer → 已发offer</div><div class="tb">HRD 批准并发出（Offer 前置页）</div></div>
          </div>
        </div>
      </div>
    </div>`;
  };

  /* ---- 面试辅助 ----
     关键设计：这一页对面试官是「我的面试」，对招聘/HRD 是「全部面试」。
     差别不在前端过滤，而在服务端返回的数据本身（见 hiring.listInterviews）。 */
  PAGES.interview = () => {
    const IV = LIVE.on ? (D.interviews || []) : DEMO_INTERVIEWS;
    const myOpen = IV.filter(i => i.status === 'scheduled' || i.status === 'in_progress');
    const myDone = IV.filter(i => i.status === 'completed');
    const me = AUTH.me || D.me || null;
    const isInterviewer = me && me.role === 'interviewer';

    /* 候选人库里可生成提纲的人：优先取自己面试里的候选人 */
    const pick = (myOpen[0] && myOpen[0].candidate) || (myDone[0] && myDone[0].candidate) || '王思远';

    return `
    <div class="page-head"><h2>招聘 Agent · 面试辅助</h2>
      <p>Agent 只做<b>信息整理与提纲生成</b>，不给录用建议 —— 录用判断永远属于人。
      面试结论由面试官本人填写，<b>写进数据库并驱动候选人阶段流转</b>。</p></div>

    <div class="kpis">
      <div class="kpi"><div class="k-label">待进行</div><div class="k-val">${myOpen.length}</div><div class="k-foot">${isInterviewer ? '只统计安排给你的' : '全部面试官'}</div></div>
      <div class="kpi"><div class="k-label">已完成</div><div class="k-val" style="color:var(--grn)">${myDone.length}</div><div class="k-foot">结论已入库</div></div>
      <div class="kpi"><div class="k-label">面试结论来源</div><div class="k-val" style="font-size:16px">面试官本人</div><div class="k-foot">HRD 与招聘专员都不能代填</div></div>
    </div>

    <div class="card pad0">
      <div class="card-h"><h3>我的面试</h3><span class="spacer"></span>
        <span class="card-sub">${isInterviewer ? '服务端只返回属于你的面试' : '全部面试（你的角色可见全量）'}</span></div>
      <div style="padding:0 16px 14px">${tbl(['候选人', '岗位', '轮次', '时间', '形式', '状态', '操作'],
      IV.map(i => `<tr>
          <td class="name">${esc(i.candidate || '')}</td>
          <td class="small">${esc(i.job || '')}</td>
          <td class="small">第 ${esc(i.round)} 轮</td>
          <td class="small mono">${esc(i.at || '—')}</td>
          <td class="small">${esc(i.mode || '')}</td>
          <td>${i.status === 'completed' ? `<span class="tag g">已完成</span><div class="small muted">${esc(i.resultLabel || '')}</div>`
        : i.status === 'in_progress' ? '<span class="tag y">面试中</span>'
          : i.status === 'cancelled' ? '<span class="tag n">已取消</span>'
            : '<span class="tag b">待面试</span>'}</td>
          <td style="white-space:nowrap">
            ${i.status === 'scheduled' ? `<button class="btn sm" data-act="itvStart" data-id="${esc(i.id)}">▶ 开始面试</button>` : ''}
            ${i.status === 'in_progress' ? `<button class="btn sm primary" data-act="itvFeedback" data-id="${esc(i.id)}">✍️ 提交结论</button>` : ''}
            ${i.status === 'completed' ? `<span class="small muted">${i.score != null ? '评分 ' + esc(i.score) : '—'}</span>` : ''}
          </td>
        </tr>`),
        '暂无面试安排。招聘专员排期后，这里会出现你的面试。')}</div>
    </div>

    ${myDone.length ? `
    <div class="card pad0" style="margin-top:14px">
      <div class="card-h"><h3>已提交的面试结论</h3><span class="spacer"></span><span class="card-sub">时间倒序 · 可审计</span></div>
      <div style="padding:0 16px 14px">
        ${myDone.map(i => `<div class="card" style="margin-top:10px;background:transparent">
          <div class="card-h"><h3><span class="tag ${i.result === 'fail' ? 'n' : i.result === 'hold' ? 'b' : 'g'}">${esc(i.resultLabel || i.result)}</span> ${esc(i.candidate || '')}
            <span class="card-sub">第 ${esc(i.round)} 轮 · ${esc(i.at || '')}</span></h3></div>
          <div class="small" style="white-space:pre-wrap">${esc(i.feedback || '（未填写纪要）')}</div>
        </div>`).join('')}
      </div>
    </div>` : ''}

    <div class="row" style="margin-top:14px">
      <div class="col">
        <div class="card">
          <div class="card-h"><h3>面试提纲生成（候选人：${esc(pick)}）</h3><span class="spacer"></span>
            <button class="btn sm" data-act="genInterview">生成提纲</button></div>
          <div id="itvOut"><div class="tbl-empty">点击「生成提纲」，Agent 会依据 JD 要求与简历疑点生成结构化面试提纲。</div></div>
        </div>
      </div>
      <div class="col" style="min-width:290px">
        <div class="card">
          <div class="card-h"><h3>简历疑点（Agent 主动标出）</h3></div>
          <ul class="list-dot">
            <li>2025.06-2025.09 有 <b>3 个月空窗期</b>，简历未说明</li>
            <li>「主导订单中心重构」未提及团队规模与个人具体职责</li>
            <li>开源项目 star 1.2k，但未说明本人贡献比例</li>
          </ul>
          <div class="hr-note">Agent 的价值不是替面试官提问，而是<b>不让面试官漏问</b>。</div>
        </div>
        <div class="card" style="margin-top:14px">
          <div class="card-h"><h3>结论如何影响流程</h3></div>
          <ul class="list-dot">
            <li><b>未通过</b> → 候选人「已淘汰」</li>
            <li><b>待定</b> → 「待复试」，需要再加一轮</li>
            <li><b>通过 · 第 1 轮</b> → 「待复试」（默认技术岗至少两轮）</li>
            <li><b>通过 · 第 2 轮</b> → 「待发offer」，交给 HRD</li>
          </ul>
          <div class="hr-note">这些流转写在后端 <span class="mono">hiring.js</span> 里，是<b>唯一一份</b>状态机 ——
          前端只展示，不参与判断。</div>
        </div>
      </div>
    </div>`;
  };

  /* ---- Offer 前置 ----
     Offer 是这条链路上**唯一带法定硬红线**的环节：最低工资、试用期上限。
     这些不是「提示一下让人自己决定」，是校验失败直接拒绝创建（见 hiring.checkOffer）。 */
  PAGES.offer = () => {
    const OF = LIVE.on ? (D.offers || []) : DEMO_OFFERS;
    const allC = D.candidates || [];
    const ready = allC.filter(c => c.stage === '待发offer');
    const canCreate = canDo('offer:create');
    const canDecide = canDo('offer:decide');
    const pending = OF.filter(o => o.status === 'pending_approval');
    const me = AUTH.me || D.me || null;
    const roleLabel = me ? (me.roleLabel || me.role) : '未登录';

    return `
    <div class="page-head"><h2>招聘 Agent · Offer 及入职前置</h2>
      <p>Agent 起草 Offer 并做<b>代码级合规校验</b>，但绝不自行发送。
      发出是高风险动作，必须过 HRD 的闸门 —— 而且是<b>另一个人</b>的闸门：起草人不能自己批。</p></div>

    <div class="kpis">
      <div class="kpi"><div class="k-label">待起草</div><div class="k-val">${ready.length}</div><div class="k-foot">面试已通过（待发offer）</div></div>
      <div class="kpi"><div class="k-label">待 HRD 审批</div><div class="k-val" style="color:var(--yel)">${pending.length}</div><div class="k-foot">${canDecide ? '你有审批权' : '你的角色只能起草'}</div></div>
      <div class="kpi"><div class="k-label">合规红线</div><div class="k-val" style="color:var(--grn)">代码校验</div><div class="k-foot">最低工资 / 试用期上限，违反即阻断</div></div>
    </div>

    <div class="card pad0">
      <div class="card-h"><h3>待起草名单</h3><span class="spacer"></span>
        <span class="card-sub">来源：面试终轮通过</span></div>
      <div style="padding:0 16px 14px">${tbl(['候选人', '岗位', 'AI 评分', '面试结论', '操作'],
      ready.map(c => `<tr>
          <td class="name">${esc(c.name)}</td>
          <td class="small">${esc(c.job || '')}</td>
          <td>${c.score != null ? `<span class="tag ${scoreColor(c.score)}">${c.score}</span>` : '<span class="small muted">—</span>'}</td>
          <td><span class="tag g">面试通过</span></td>
          <td>${canCreate
        ? `<button class="btn sm primary" data-act="offerForm" data-id="${esc(c.id)}">📄 起草 Offer</button>`

      const payload = {

      };
      const mode = state.jobForm && state.jobForm.mode;

      if (!LIVE.on) {
        /* 离线兜底：写进内存（刷新即复原），仍能演示完整交互。
           切条规则与后端同源：整段 JD 走 parseReqText（剥符号+小标题归位），
           普通填写就是「一行一条」。 */
        const RL = window.ReqLib;
        const parseFn = v => RL && RL.parseReqText ? RL.parseReqText(v) : null;
        const pM = parseFn(payload.mustHave), pN = parseFn(payload.niceHave);
        const mustItems = pM ? pM.must : String(payload.mustHave || '').split(/[,，\n]/).map(s => s.trim()).filter(Boolean);
        const niceItems = pN ? (pN.heads ? pN.nice : pN.must) : String(payload.niceHave || '').split(/[,，\n]/).map(s => s.trim()).filter(Boolean);
        const kw = mustItems.concat(niceItems).slice(0, 6);
        if (mode === 'edit' && editId) {

            mustHaveText: mustItems, niceHave: niceItems, keywords: kw,

    async genJobJD() {
      const val = id => { const e = $(id); return e ? e.value.trim() : ''; };

      if (!title) { toast('先填岗位名称，Agent 才能生成 JD。', 'warn'); return; }

      const payload = { title, industry, dept: val('#jfDept'), years: Number(val('#jfYears') || 0),
        eduRank: Number(val('#jfEdu') || 0),

      const hint = $('#jfHint'); if (hint) hint.textContent = 'Agent 生成中…';
      let r = null;

      if (!r || r.status === 'error') r = offlineGenJD(payload);

    /* --- JD 工作台（岗位 / 行业自由填写；在线走后端 Agent，离线用内置模板兜底） --- */
    async runJD() {
      const val = s => { const e = $(s); return e ? e.value.trim() : ''; };
      const title = val('#jdTitle');
      if (!title) { toast('请先填写岗位名称（可以是你想招的任意岗位）。', 'warn'); return; }
      const BENEFIT_MAP = [['#jdB0', '弹性工作制（10:00 前到岗，当日工作满 8 小时）'], ['#jdB1', '依法足额缴纳五险一金'],
        ['#jdB2', '带薪年假、法定节假日按国家规定执行'], ['#jdB3', '补充商业医疗保险'], ['#jdB4', '培训预算与内部晋升通道']];
      const payload = {
        title, industry: val('#jdIndustry') || '通用', dept: val('#jdDept'),
        must: val('#jdMust'), nice: val('#jdNice'),
        years: Number(val('#jdYears') || 0), eduRank: Number(val('#jdEdu') || 0),
        headcount: Number(val('#jdHead') || 1), salary: val('#jdSalary'),
        benefits: BENEFIT_MAP.filter(([sel]) => { const e = $(sel); return e && e.checked; }).map(([, t]) => t)
      };
      $('#jdMeta').textContent = 'Agent 运行中…';
      $('#jdBody').innerHTML = '<div id="jdHost"></div>';
      await A.run('jd', $('#jdHost'), {});
      let r = null;
      if (LIVE.on) { try { r = await apiFetch('POST', '/api/agent/jd/generate', payload); } catch (e) { r = null; } }
      if (!r || r.status === 'error') {
        const off = offlineGenJD(payload);
        r = { jd: off.jd, scan: off.scan, mustHave: off.mustHave, niceHave: off.niceHave, keywords: off.keywords,
          industry: payload.industry, title, blockPublish: off.blockPublish };
      }
      const flagged = (r.scan && r.scan.flagged) || [], legal = (r.scan && r.scan.legal) || [];
      const blocked = flagged.length + legal.length;
      state.lastJd = { title, industry: payload.industry, dept: payload.dept, years: payload.years,
        headcount: payload.headcount, salary: payload.salary,
        mustHave: r.mustHave || [], niceHave: r.niceHave || [], jd: r.jd };
      $('#jdMeta').textContent = `生成完成 · 命中 ${flagged.length} 处歧视性表述 · ${legal.length} 处违法表述`;
      $('#jdBody').innerHTML = `
        ${blocked
          ? `<div class="scanwarn">⚠️ 合规扫描命中 ${blocked} 处，<b>已阻止直接发布</b>。下面是具体问题和建议改法：</div>`
          : `<div class="scanok" style="padding:10px 12px">✅ 合规扫描通过：未命中歧视性用语与违法表述，可提交人工确认后发布。</div>`}
        ${flagged.map(f => `<div class="callout" style="border-color:rgba(245,185,66,.4)">
          <b style="color:var(--yel)">歧视性表述：${esc(f.word)}${f.line ? '（第 ' + f.line + ' 行）' : ''}</b><br>
          <span class="small">风险：${esc(f.why)}</span><br>
          <span class="small" style="color:var(--grn)">建议改为：${esc(f.fix)}</span></div>`).join('')}
        ${legal.map(f => `<div class="callout" style="border-color:rgba(255,107,107,.4)">
          <b style="color:var(--red)">违法表述：${esc(f.word)}${f.line ? '（第 ' + f.line + ' 行）' : ''}</b><br>
          <span class="small">风险：${esc(f.why)}</span><br>
          <span class="small" style="color:var(--grn)">建议改为：${esc(f.fix)}</span></div>`).join('')}
        <div class="callout"><b>Agent 依据</b>：${r.fnName ? `识别职能「${esc(r.fnName)}」` : '未识别出明确职能，按行业兜底'} · 行业「${esc(r.industry || payload.industry)}」 · 任职要求按六维度扩充 · 自动抽取打分关键词 ${(r.keywords || []).length} 个<br>
          ${(r.keywords || []).map(k => `<span class="tag">${esc(k)}</span>`).join(' ') || '<span class="muted small">（离线模式未抽取，启动后端后可见）</span>'}
          <div class="small muted" style="margin-top:6px">这些关键词会在「简历筛选台」用来给候选人打分 —— 所以 JD 写什么，决定 Agent 怎么筛人。</div></div>
        <div class="small muted" style="margin:14px 0 6px">JD 正文：</div>
        <div class="callout small jd-doc" style="max-height:360px;overflow:auto">${renderJD(r.jd)}</div>
        <div style="display:flex;gap:9px;margin-top:12px;flex-wrap:wrap">

          <button class="btn ${blocked ? 'danger' : 'primary'}" data-act="toast"
            data-msg="${blocked ? '⛔ 已阻止发布：请先按上面的建议修改命中表述，改完重新生成扫描。' : '✅ JD 已提交人工确认，确认后写入 ATS 并同步招聘渠道。'}">
            ${blocked ? '⛔ 已阻止发布（需先整改）' : '✅ 确认并发布到 ATS'}</button>
        </div>`;
      toast(blocked ? `JD 已生成，合规扫描命中 ${blocked} 处问题，已阻止发布。` : 'JD 已生成，合规扫描通过。', blocked ? 'warn' : 'ok');
    },

    /* ================= 招聘链路：排期 → 面试 → 结论 → Offer → 入职 =================
       这一组处理器把「已邀约」之后的死路接上了。三个铁律：
       1) 前端只收集输入、只展示结果；**状态流转全部由后端 hiring.js 决定**，
          前端从不自己算「这一轮过没过」——否则前端和后端就是两份状态机。
       2) 离线态（file:// 打开）没有服务端，就退回本地 DEMO_* 数组做同等交互，
          保证断网也能把整条链路点完（这是演示刚需）。
       3) 按钮已经用 canDo() 守过一遍能力；这里再判一次是防「手改 DOM」，
          但**真正的拦截永远在服务端 403**。 */

    /* --- 排期：已邀约 → 待面试 --- */
    schedForm(el) {
      const cid = el.dataset.id;
      const c = (D.candidates || []).find(x => String(x.id) === String(cid));
      const name = c ? c.name : cid;
      const list = (D.interviewers && D.interviewers.length) ? D.interviewers
        : [{ id: 'U-007', name: '王磊', title: '后端负责人' }, { id: 'U-008', name: '孙倩', title: '产品负责人' }];
      const round = c && c.stage === '待复试' ? 2 : 1;
      openModal(`<div class="drawer-h"><h3>📅 安排面试 · ${esc(name)}</h3></div>
        <div style="padding:18px">
          <div class="callout small" style="margin-top:0">岗位：${esc(c ? (c.job || '') : '')} ·
            当前阶段：${esc(c ? c.stage : '—')} · 本轮次：第 ${round} 轮</div>
          <label class="f">面试官</label>
          <select class="i" id="schItv">${list.map(i => `<option value="${esc(i.id)}">${esc(i.name)} · ${esc(i.title || '')}</option>`).join('')}</select>
          <label class="f" style="margin-top:12px">面试时间</label>
          <input class="i" id="schAt" placeholder="2026-09-30 10:00" value="${round === 1 ? '2026-09-30 10:00' : '2026-10-08 14:00'}">
          <div class="small muted" style="margin-top:4px">必须是 <span class="mono">YYYY-MM-DD HH:MM</span>，模糊写法后端一律拒绝（不猜时间）。</div>
          <div class="row" style="margin-top:12px">
            <div class="col"><label class="f">形式</label>
              <select class="i" id="schMode"><option>线上</option><option>现场</option></select></div>
            <div class="col"><label class="f">时长（分钟）</label><input class="i" id="schDur" value="60"></div>
          </div>
          <div class="scanwarn" style="margin-top:14px">一个人同时只能有 <b>1 场未完成的面试</b>。
            需要改约就先取消 —— 取消会把阶段退回、但不占用轮次号。</div>
          <div style="display:flex;gap:9px;margin-top:16px;justify-content:flex-end">
            <button class="btn ghost" data-act="closeModal">取消</button>
            <button class="btn primary" data-act="schedSubmit" data-id="${esc(cid)}">确认排期</button>
          </div>
        </div>`);
    },
    async schedSubmit(el) {
      const cid = el.dataset.id;
      const payload = {
        candidateId: cid,
        interviewerId: $('#schItv') ? $('#schItv').value : '',
        scheduledAt: $('#schAt') ? $('#schAt').value.trim() : '',
        mode: $('#schMode') ? $('#schMode').value : '线上',
        durationMin: Number(($('#schDur') || {}).value || 60)
      };
      if (!payload.scheduledAt) { toast('请填写面试时间（YYYY-MM-DD HH:MM）。', 'warn'); return; }
      if (LIVE.on) {
        try {
          const r = await apiFetch('POST', '/api/interviews', payload);
          closeModal(); await liveRefresh(); render();
          toast(`✓ 已排期：${r.interviewer || ''} · ${r.at || payload.scheduledAt}（第 ${r.round || ''} 轮）· 候选人进入「待面试」`);
        } catch (e) { toast('排期失败：' + e.message, 'err'); }
        return;
      }
      /* 离线态：本地模拟同一套规则 */
      const c = (D.candidates || []).find(x => String(x.id) === String(cid));
      const existed = DEMO_INTERVIEWS.find(i => i.candidateId === cid && (i.status === 'scheduled' || i.status === 'in_progress'));
      if (existed) { toast('该候选人已有一场未完成的面试，请先取消再改约。', 'warn'); return; }
      const iv = [{ id: 'U-007', name: '王磊', title: '后端负责人' }, { id: 'U-008', name: '孙倩', title: '产品负责人' }]
        .find(x => x.id === payload.interviewerId) || { name: '王磊', title: '后端负责人' };
      DEMO_INTERVIEWS.unshift({ id: 'D' + (Date.now() % 10000), candidateId: cid, candidate: c ? c.name : cid,
        job: c ? (c.job || '') : '', round: c && c.stage === '待复试' ? 2 : 1, mode: payload.mode,
        at: payload.scheduledAt, durationMin: payload.durationMin, interviewer: iv.name, interviewerTitle: iv.title,
        status: 'scheduled', resultLabel: '' });
      if (c) c.stage = '待面试';
      closeModal(); render();
      toast('（离线演示）已排期：候选人进入「待面试」。');
    },

    async itvFeedbackSubmit(el) {
      const id = el.dataset.id;
      const result = $('#fbResult') ? $('#fbResult').value : 'pass';
      const feedback = $('#fbText') ? $('#fbText').value.trim() : '';
      const scoreRaw = $('#fbScore') ? $('#fbScore').value.trim() : '';

      if (!feedback) { toast('请填写面试纪要 —— 结论必须留下依据，这是可审计的要求。', 'warn'); return; }
      if (LIVE.on) {
        try {
          const r = await apiFetch('POST', `/api/interviews/${encodeURIComponent(id)}/feedback`, { result, feedback, score });
          closeModal(); await liveRefresh(); render();
          toast(`✓ 结论已入库：${r.resultLabel || result} → 候选人阶段：${r.stage || ''}`);
        } catch (e) { toast('提交失败：' + e.message, 'err'); }
        return;

      const i = DEMO_INTERVIEWS.find(x => String(x.id) === String(id));
      const c = i && (D.candidates || []).find(x => String(x.id) === String(i.candidateId) || x.name === i.candidate);
      const label = { pass: '通过', hold: '待定', fail: '未通过' }[result] || result;
      if (i) { i.status = 'completed'; i.result = result; i.resultLabel = label; i.feedback = feedback; i.score = score; }
      if (c) c.stage = result === 'fail' ? '已淘汰' : result === 'hold' ? '待复试' : (i && i.round >= 2 ? '待发offer' : '待复试');
      closeModal(); render();
      toast(`（离线演示）结论已记录：${label} → ${c ? c.stage : ''}`);
    },
