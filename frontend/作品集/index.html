<!DOCTYPE html>
<!--
  ============================================================================
  本文件是「HR-Agent-OS_作品集_19页_单文件.html」的派生版（2026-10-13 生成）。
  原文件未做任何改动，两者可以并存。
  相对底本的改动只有三件事：
    ① 新增第 1 页「星环封面」—— 把「环形画廊标题_HR人才星环」的 Canvas2D 公转环
       移植到 1440×810 画布上；环持续转动（鼠标越快越快，停手不静止）。
    ② 翻页交互：去掉「上一页 / 下一页」按钮，改为点击画面任意处翻下一页
       （末页循环回封面）。过渡为**叠层淡入上浮**（旧页淡出上移、新页自下方浮起；
       回上一页时方向翻转）——早期那版 3D 立方体翻转 + 径向冲击波 + 快门闪白
       + 镜头抖动，因「字形被拉成梯形、观感冗杂」已全部拆除。
    ③ 页码：原 19 页页脚 `NN / 19` 顺延为 `NN+1 / 20`。
    ④ 动效强度策略（<head> 里的 <script id="deck-motion">）：不再让系统的
       「减少动态效果」把动画整个关掉 —— 默认完整播放，按 M 可切到柔和模式
       （只关入场 / 视差，星环照转、翻页照翻）。
    ⑤ 简洁化：第 2–20 页去掉常驻装饰的「动」与「噪」—— 停掉光晕的无限呼吸、
       隐藏 72px 满屏方格纸、暗角由 55% 降到 26%、提示条箭头不再循环下落。
       **星环封面（第 1 页）一字未动**（光晕呼吸 / 方格纸 / 重暗角原样保留）。
       全部靠后置覆盖与本地补丁实现，删掉注入块即回原样。
  改动说明见 WorkBuddy/skill/HR-Agent-OS_星环封面与点屏翻页_改动说明.md
  ============================================================================
-->

         media="print" 让这张样式表不参与渲染阻塞，加载成功后再切回 all。

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Inter:wght@300;400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Inter:wght@300;400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">

    <style>
        :root {
            --primary-color: #38BDF8;
            --accent-color-1: #22D3EE;
            --accent-color-2: #FBBF24;
            --neutral-color: #94A3B8;
            --slide-background: #060910;
            --font-title: 'Montserrat', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Source Han Sans SC', system-ui, sans-serif;
            --font-body: 'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Source Han Sans SC', system-ui, sans-serif;
        }
    </style>
    <style id="deck-theme">
        /* ==========================================================================
           Editorial Dark —— 作品集统一版式系统
           设计取向：杂志编辑部式的排版（发丝线 / 超大数字 / 非对称网格 / 大量留白），
           而不是「一堆圆角卡片」。底色近黑，冷色（蓝/青）承担结构，暖色只用于情绪与红线。
           ========================================================================== */
        :root {
            --ink: #060910;
            --ink2: #0B121F;
            --ink3: #0F1728;
            --paper: #F2F6FF;
            --dim: #93A4BF;
            --mute: #5A6A85;
            --faint: #39445A;
            --line: rgba(147, 166, 196, .16);
            --line2: rgba(147, 166, 196, .30);
            --blue: #38BDF8;
            --cyan: #22D3EE;
            --amber: #FBBF24;
            --ember: #FF6B4A;
        }

        .ed-page {
            width: 1440px;
            height: 810px;
            position: relative;
            overflow: hidden;
            background: var(--ink);
            color: var(--paper);
            font-family: var(--font-body);
            font-synthesis: none;
        }

        /* ---------- 底纹：方格纸 + 光晕 + 暗角 ---------- */
        .ed-grid {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(120, 160, 220, .05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(120, 160, 220, .05) 1px, transparent 1px);
            background-size: 72px 72px;
            -webkit-mask-image: radial-gradient(125% 95% at 50% 42%, #000 30%, transparent 100%);
            mask-image: radial-gradient(125% 95% at 50% 42%, #000 30%, transparent 100%);
        }

        .ed-glow {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .ed-vig {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(135% 115% at 50% 45%, transparent 42%, rgba(0, 0, 0, .55) 100%);
        }

        /* ---------- 左侧竖脊 ---------- */
        .ed-rail {
            position: absolute;
            left: 42px;
            top: 56px;
            bottom: 66px;
            width: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .ed-rail-num {
            font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
            font-size: 13px;
            letter-spacing: .12em;
            color: var(--blue);
        }

        .ed-rail-line {
            flex: 1;
            width: 1px;
            margin: 12px 0;
            background: linear-gradient(to bottom, transparent, var(--line2), transparent);
        }

        .ed-rail-label {
            writing-mode: vertical-rl;
            font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
            font-size: 10px;
            letter-spacing: .34em;
            text-transform: uppercase;
            color: var(--faint);
        }

        /* ---------- 正文区 / 页脚 ---------- */
        .ed-body {
            position: absolute;
            left: 104px;
            right: 72px;
            top: 54px;
            bottom: 68px;
            display: flex;
            flex-direction: column;
        }

        .ed-foot {
            position: absolute;
            left: 104px;
            right: 72px;
            bottom: 26px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
            font-size: 10px;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: var(--faint);
        }

        .ed-foot em {
            font-style: normal;
            color: var(--mute);
        }

        /* ---------- 页头 ---------- */
        .ed-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 40px;
        }

        .ed-eyebrow {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
            font-size: 11px;
            letter-spacing: .26em;
            text-transform: uppercase;
            color: var(--mute);
        }

        .ed-eyebrow i {
            width: 6px;
            height: 6px;
            background: var(--blue);
            display: inline-block;
            flex: none;
        }

        .ed-title {
            font-family: var(--font-title);
            font-weight: 700;
            font-size: 42px;
            line-height: 1.12;
            letter-spacing: -.012em;
            color: var(--paper);
            margin: 14px 0 0;
        }

        .ed-title em {
            font-style: normal;
            color: var(--blue);
        }

        .ed-sub {
            font-size: 15px;
            line-height: 1.55;
            color: var(--dim);
            margin-top: 10px;
        }

        .ed-hr {
            height: 1px;
            background: var(--line2);
            margin: 20px 0 0;
            flex: none;
        }

        /* ---------- 索引行（本期主力版式） ---------- */
        .ed-rows {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .ed-row {
            display: grid;
            align-items: start;
            gap: 26px;
            padding: 15px 0;
            border-bottom: 1px solid var(--line);
        }

        .ed-row:last-child {
            border-bottom: none;
        }

        /* 可跳转行（目录页用）：data-goto 由 ppt-controller 里的委托点击消费。
           悬停底色由这里的 CSS 给；光标与左右内缩写在行内样式里 —— 行内已有
           padding 简写，会盖掉类里的 padding-left，写两处必踩坑。 */
        .ed-row[data-goto] { transition: background-color .18s ease; }
        .ed-row[data-goto]:hover { background-color: rgba(56, 189, 248, .07); }
        .ed-row[data-goto]:hover .ed-k { color: #7DD3FC; }

        .ed-n {
            font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
            font-size: 14px;
            letter-spacing: .06em;
            color: var(--blue);
            padding-top: 5px;
        }

        .ed-h3 {
            font-family: var(--font-title);
            font-weight: 700;
            font-size: 21px;
            line-height: 1.3;
            color: var(--paper);
        }

        .ed-p {
            font-size: 14px;
            line-height: 1.68;
            color: var(--dim);
        }

        .ed-k {
            font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
            font-size: 10px;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--cyan);
        }

        .ed-accent { color: var(--blue); }
        .ed-cy { color: var(--cyan); }
        .ed-warn { color: var(--amber); }
        .ed-hot { color: var(--ember); }
        .ed-dim { color: var(--dim); }
        .ed-mute { color: var(--mute); }

        b.ed-b { font-weight: 700; color: var(--paper); }

        /* ---------- 面板（角标式，取代圆角卡片） ---------- */
        .ed-panel {
            position: relative;
            padding: 18px 20px;
            background: rgba(11, 18, 31, .72);
            border: 1px solid var(--line);
        }

        .ed-panel > .ed-tick {
            position: absolute;
            width: 9px;
            height: 9px;
            border: 1px solid var(--blue);
            opacity: .85;
        }

        .ed-panel > .ed-tick.tl { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
        .ed-panel > .ed-tick.br { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

        .ed-panel.warm { border-color: rgba(255, 107, 74, .34); background: rgba(255, 107, 74, .05); }
        .ed-panel.warm > .ed-tick { border-color: var(--ember); }
        .ed-panel.alert { border-color: rgba(251, 191, 36, .34); background: rgba(251, 191, 36, .05); }
        .ed-panel.alert > .ed-tick { border-color: var(--amber); }

        /* ---------- 数据 ---------- */
        .ed-num {
            font-family: var(--font-title);
            font-weight: 700;
            font-size: 62px;
            line-height: .95;
            letter-spacing: -.035em;
            color: var(--paper);
        }

        .ed-num.sm { font-size: 44px; }

        .ed-cap {
            font-size: 13px;
            line-height: 1.6;
            color: var(--dim);
        }

        .ed-cell {
            padding: 0 26px;
            border-left: 1px solid var(--line);
        }

        .ed-cell:first-child { border-left: none; padding-left: 0; }

        /* ---------- 徽标 / 条幅 ---------- */
        .ed-chip {
            display: inline-block;
            font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
            font-size: 10px;
            letter-spacing: .18em;
            text-transform: uppercase;
            padding: 4px 9px;
            border: 1px solid var(--line2);
            color: var(--dim);
        }

        .ed-chip.amber { border-color: rgba(251, 191, 36, .5); color: var(--amber); }
        .ed-chip.cyan { border-color: rgba(34, 211, 238, .5); color: var(--cyan); }
        .ed-chip.hot { border-color: rgba(255, 107, 74, .5); color: var(--ember); }

        .ed-banner {
            border-top: 1px solid var(--line2);
            border-bottom: 1px solid var(--line2);
            padding: 13px 0;
            text-align: center;
            font-size: 16px;
            line-height: 1.5;
            color: #C6D3E8;
        }

        /* ---------- 封面：左侧「HR 的一天」日志 ---------- */
        .ed-log {
            position: absolute;
            left: 104px;
            top: 148px;
            width: 322px;
        }

        .ed-log-list {
            margin-top: 24px;
            position: relative;
            padding-left: 22px;
        }

        .ed-log-list::before {
            content: '';
            position: absolute;
            left: 3px;
            top: 6px;
            bottom: 10px;
            width: 1px;
            background: linear-gradient(to bottom, rgba(147, 166, 196, .08), rgba(255, 107, 74, .55));
        }

        .ed-log-item {
            position: relative;
            margin-bottom: 25px;
        }

        .ed-log-item::before {
            content: '';
            position: absolute;
            left: -22px;
            top: 5px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--ink);
            border: 1px solid var(--faint);
        }

        .ed-log-item.hot::before {
            background: var(--ember);
            border-color: var(--ember);
            box-shadow: 0 0 12px rgba(255, 107, 74, .85);
        }

        .ed-log-item i {
            display: block;
            font-style: normal;
            font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
            font-size: 11px;
            letter-spacing: .1em;
            color: var(--mute);
        }

        .ed-log-item b {
            display: block;
            font-weight: 400;
            font-size: 14px;
            line-height: 1.5;
            color: #8E9DB8;
            margin-top: 3px;
        }

        .ed-log-item.hot b { color: #FFB39B; }

        /* ---------- 封面：右侧叙事 ---------- */
        .ed-cover {
            position: absolute;
            left: 508px;
            right: 88px;
            top: 122px;
        }

        .ed-cover h1 {
            font-family: var(--font-title);
            font-weight: 700;
            font-size: 66px;
            line-height: 1.1;
            letter-spacing: -.02em;
            color: var(--paper);
            margin: 20px 0 0;
        }

        .ed-cover h1 em {
            font-style: normal;
            color: var(--ember);
        }

        .ed-brand {
            font-family: var(--font-title);
            font-weight: 700;
            font-size: 34px;
            letter-spacing: -.01em;
            color: var(--blue);
        }

        .ed-statbar {
            display: flex;
            align-items: center;
            gap: 22px;
            font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
            font-size: 12px;
            letter-spacing: .1em;
            color: var(--dim);
            flex-wrap: wrap;
        }

        .ed-statbar span.sep { color: var(--faint); }

        /* ---------- 过渡页 ---------- */
        .ed-trans-num {
            position: absolute;
            right: 30px;
            bottom: -84px;
            font-family: var(--font-title);
            font-weight: 700;
            font-size: 400px;
            line-height: 1;
            letter-spacing: -.06em;
            color: rgba(56, 189, 248, .075);
            pointer-events: none;
        }

        .ed-trans {
            position: absolute;
            left: 152px;
            top: 50%;
            transform: translateY(-50%);
            max-width: 780px;
            padding-left: 34px;
            border-left: 2px solid var(--blue);
        }

        .ed-trans h2 {
            font-family: var(--font-title);
            font-weight: 700;
            font-size: 70px;
            line-height: 1.08;
            letter-spacing: -.02em;
            color: var(--paper);
            margin-top: 18px;
        }

        .ed-trans p {
            font-size: 18px;
            line-height: 1.65;
            color: var(--dim);
            margin-top: 20px;
        }

        .ed-trans .ed-eyebrow { color: var(--blue); }

        /* ---------- 两栏分屏 ---------- */
        .ed-split {
            display: grid;
            grid-template-columns: 1fr 1px 1fr;
            gap: 40px;
            flex: 1;
            min-height: 0;
            margin-top: 6px;
        }

        .ed-split .divider {
            background: linear-gradient(to bottom, transparent, var(--line2) 12%, var(--line2) 88%, transparent);
        }

        .ed-split h3 {
            font-family: var(--font-title);
            font-weight: 700;
            font-size: 22px;
            color: var(--paper);
            margin-bottom: 4px;
        }

        /* ---------- 时间轴 ---------- */
        .ed-tl {
            position: relative;
            padding-left: 30px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .ed-tl::before {
            content: '';
            position: absolute;
            left: 4px;
            top: 12px;
            bottom: 12px;
            width: 1px;
            background: linear-gradient(to bottom, var(--line2), var(--line));
        }

        .ed-tl-item { position: relative; }

        .ed-tl-item::before {
            content: '';
            position: absolute;
            left: -30px;
            top: 7px;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--ink);
            border: 1px solid var(--blue);
        }
    </style>

<script id="deck-motion">
/* ==========================================================================
   动效强度策略 —— 必须在所有脚本之前执行（构建脚本把它放在 <head> 里）
   ---------------------------------------------------------------------------
   为什么要有这个文件（一次真实的翻车）：
     上一版把「系统开了『减少动态效果』」当成了**硬开关**：星环的渲染循环和翻页
     动画直接 return 掉。观感就是「星环不转、点屏翻页变成了瞬移、整站像一张静态
     图」—— 那是一个 bug，不是无障碍。作品集里动效就是内容，不能被一个系统开关
     整个删掉。

   现在的规则：
     · **默认完整播放**：不看系统开关（系统偏好只记录在 state 里，供排查用）。
     · 需要柔和的按 M 切换：关掉入场 / 视差 / 镜头抖动这些"幅度大、易致不适"的
       项，但**星环照转、翻页照翻** —— 只降强度，不停动作。
     · 选择写进 localStorage，刷新后保持。
     · 不管哪个模式，环的转速策略、翻页的立方体过渡都完整保留。

   实现：给 <html> 挂 .deck-motion-full / .deck-calm 两个互斥的类；底本里那些
   @media (prefers-reduced-motion: reduce) 规则由构建脚本逐条改写成
   :where(html:not(.deck-motion-full)) 前缀（用 :where() 保持原特异性不变）。
   ========================================================================== */
(function () {
    'use strict';

    var KEY = 'deck-motion';
    var mq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;

    var M = window.__deckMotion = {
        sys: !!(mq && mq.matches),      /* 系统偏好：只记录，不再拿它当开关 */
        force: null,                    /* 'full' | 'calm' */

        calm: function () { return M.force === 'calm'; },
        state: function () { return { force: M.force, sys: M.sys, calm: M.calm() }; },

        apply: function () {
            var h = document.documentElement;
            h.classList.toggle('deck-motion-full', !M.calm());
            h.classList.toggle('deck-calm', M.calm());
        },

        set: function (v, quiet) {
            M.force = (v === 'calm' ? 'calm' : 'full');
            M.apply();
            try { localStorage.setItem(KEY, M.force); } catch (e) { }
            if (!quiet) M.toast();
            if (window.__deckMotionChanged) window.__deckMotionChanged();
            return M.state();
        },
        toggle: function () { return M.set(M.calm() ? 'full' : 'calm'); },

        toast: function () {
            var el = document.getElementById('deckToast');
            if (!el) {
                el = document.createElement('div');
                el.id = 'deckToast';
                el.className = 'deck-toast';
                el.setAttribute('role', 'status');
                el.setAttribute('aria-live', 'polite');
                (document.body || document.documentElement).appendChild(el);
            }
            el.textContent = M.calm()
                ? '柔和模式 · 星环照转，入场与视差已关（按 M 切回）'
                : '完整动效 · 入场 / 视差 / 冲击全开（按 M 切换）';
            el.classList.remove('on');
            void el.offsetWidth;
            el.classList.add('on');
            clearTimeout(M._t);
            M._t = setTimeout(function () { el.classList.remove('on'); }, 2400);
        }
    };

    /* 读上次选择；没有就默认完整 */
    try {
        var v = localStorage.getItem(KEY);
        if (v === 'full' || v === 'calm') M.force = v;
    } catch (e) { }
    if (!M.force) M.force = 'full';
    M.apply();

    /* 底本脚本用它替掉各自的 `var reduce = matchMedia(...)` */
    window.__deckCalm = function () { return M.calm(); };

    /* M 键切换（在输入框里不抢键） */
    window.addEventListener('keydown', function (e) {
        if (e.metaKey || e.ctrlKey || e.altKey) return;
        if (e.key !== 'm' && e.key !== 'M') return;
        var t = e.target;
        if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
        e.preventDefault();
        M.toggle();
    }, false);
})();

                    + '.ed-head, .ed-hr, .ed-banner, .ed-rows > *, .ed-split > *,'

            }

                if (pending) return;
                pending = true;
                window.requestAnimationFrame(function () {
                    pending = false;
                    var mid = window.innerHeight * .42, idx = 0, best = Infinity;
                    for (var i = 0; i < slides.length; i++) {
                        var r = slides[i].getBoundingClientRect();
                        if (r.top <= mid && r.bottom >= mid) { idx = i; break; }
                        var d = Math.abs(r.top - mid);
                        if (d < best) { best = d; idx = i; }
                    }
                    if (idx !== cur) {
                        cur = idx;
                        var ch = chapterOf(idx);
                        for (var k = 0; k < navLinks.length; k++) {
                            navLinks[k].className = (k === ch) ? 'on' : '';
                        }
                        if (countEl) countEl.textContent = pad(idx + 1) + ' / ' + pad(slides.length);
                    }
                    var max = document.documentElement.scrollHeight - window.innerHeight;
                    var p = max > 0 ? window.pageYOffset / max : 0;
                    if (progEl) progEl.style.width = (Math.max(0, Math.min(1, p)) * 100) + '%';
                    if (hintEl) hintEl.classList.toggle('hide', window.pageYOffset > 40);
                });
            }

            function boot() {
                slides = [].slice.call(viewport.querySelectorAll('.slide'));
                if (!slides.length) return;
                slides.forEach(function (s, i) { s.id = 'sec-' + (i + 1); });

                /* 预置：未进入视口的内容先隐藏，滚动到时再揭幕。
                   已在 .active 的页面跳过，避免盖掉首屏已播的入场。 */
                if (!reduce) {
                    slides.forEach(function (s) {
                        if (s.classList.contains('active')) return;
                        blocksOf(s).forEach(function (el) {
                            var t = window.getComputedStyle(el).transform;
                            el.classList.add((t && t !== 'none') ? 'ed-anim-fade' : 'ed-anim');
                        });
                    });
                }

                /* 吸顶导航 */
                if (linksBox) {
                    CHAPTERS.forEach(function (c) {
                        var a = document.createElement('a');
                        a.href = '#sec-' + (c.i + 1);
                        a.textContent = c.name;
                        a.addEventListener('click', function (e) { e.preventDefault(); goTo(c.i); });
                        linksBox.appendChild(a);
                        navLinks.push(a);
                    });
                }
                if (countEl) countEl.textContent = pad(1) + ' / ' + pad(slides.length);

                /* 进入视口 → 揭幕（每段只播一次） */
                if ('IntersectionObserver' in window) {
                    var io = new IntersectionObserver(function (entries) {
                        entries.forEach(function (en) {
                            if (en.isIntersecting && en.intersectionRatio >= .18) reveal(en.target);
                        });
                    }, { threshold: [0, .18, .35, .6] });
                    slides.forEach(function (s) { io.observe(s); });
                } else {
                    slides.forEach(reveal);
                }

                /* 目录页行：点击跳转到对应节段 */
                viewport.addEventListener('click', function (e) {
                    var row = e.target && e.target.closest ? e.target.closest('[data-goto]') : null;
                    if (!row) return;
                    var n = parseInt(row.getAttribute('data-goto'), 10);
                    if (!isNaN(n)) goTo(n - 1);
                });

                window.addEventListener('scroll', onScroll, { passive: true });
                window.addEventListener('resize', onScroll);
                onScroll();

                /* 深链兼容：?page=N 加载后直接滚到第 N 页 */
                var m = /[?&]page=(\d+)/.exec(window.location.search);
                if (m) {
                    var n = parseInt(m[1], 10);
                    if (n > 1 && n <= slides.length) setTimeout(function () { goTo(n - 1); }, 60);
                }
            }

            (function wait(n) {
                if (viewport.querySelector('.slide')) { boot(); return; }
                if (n > 400) return;
                window.requestAnimationFrame(function () { wait(n + 1); });
            })(0);
        })();
    </script>

    <script>
        /* ======================================================================
           滚动视差驱动（本次唯一的 transform 写者）
           · 分层视差：每页的 光晕 / 方格纸 / 暗角 / 大号章节数字 按不同系数随滚动位移
           · 进入推近：页面尚未对齐视口时整块画布轻微放大，对齐后归位
           · 首屏缓推：封面方格纸 26s 一次缓慢推近（离开视口即停，不做常驻动画）
           · 标题遮罩：进入视口时给 .ed-title / .ed-eyebrow 挂 edMask
           三条开销约束：① 只处理"当前在视口里"的节段；② 值没变就不碰样式；
           ③ 除了封面底纹在缓推，没有别的原因就停掉 rAF，不空转。
           ====================================================================== */
        (function () {
            'use strict';

            var viewport = document.getElementById('ppt-viewport');
            if (!viewport) return;

            var reduce = window.__deckCalm();
            if (reduce) return;   /* 降低动效：一条都不做，静态兜底由 CSS 负责 */

            /* k > 0 → 背景滞后（位移与滚动反向）；k < 0 → 前景抢先（相对更快） */
            var LAYERS = [
                { sel: '.ed-glow',      k:  46, base: 1.05, px:  26, py:  18 },
                { sel: '.ed-vig',       k:  14, base: 1.00, px:   0, py:   0 },
                { sel: '.ed-trans-num', k: -32, base: 1.00, px: -34, py: -22 }
            ];
            var TITLE_SEL  = '.ed-title, .ed-eyebrow';
            var ZOOM       = 0.02;    /* 进入推近幅度 */
            var SETTLE     = 360;     /* 停止滚动后多跑一会儿，让位移收敛 */

            var slides = [], live = [], running = false, needUntil = 0;

            function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

            function write(el, css) {          /* 值没变就不写，省掉无谓的样式重算 */
                if (el.__deckT === css) return;
                el.__deckT = css;
                el.style.transform = css;
            }

            function compose() {
                var ptr = window.__deckPtr || { x: 0, y: 0 };

                for (var i = 0; i < live.length; i++) {
                    var s = live[i], canvas = s.firstElementChild;
                    if (!canvas) continue;

                    var r = s.getBoundingClientRect();
                    var q = clamp(r.top / (r.height || window.innerHeight), -1, 1);
                    /* q：+1 还在下方待入场 · 0 已对齐 · -1 已滚过 */

                    /* 进入推近：只在"尚未对齐"的半个行程里放大，滚过后不再缩放，避免来回抖 */
                    canvas.style.setProperty('--deck-zoom', (1 - ZOOM * Math.max(0, q)).toFixed(4));

                    for (var j = 0; j < LAYERS.length; j++) {
                        var L = LAYERS[j];
                        var el = s.querySelector(L.sel);
                        if (!el) continue;
                        var sc = L.base;
                        write(el, 'translate3d(' + (ptr.x * L.px).toFixed(2) + 'px,'
                                  + (ptr.y * L.py - q * L.k).toFixed(2) + 'px,0) scale(' + sc.toFixed(4) + ')');
                    }
                }
            }

            function loop() {
                running = false;
                compose();
                var coverOn = slides.length > 0 && live.indexOf(slides[0]) >= 0;
                if (coverOn || performance.now() < needUntil) {
                    running = true;
                    requestAnimationFrame(loop);
                }
            }

            function wake(ms) {
                var t = performance.now() + (ms || SETTLE);
                if (t > needUntil) needUntil = t;
                if (!running) { running = true; requestAnimationFrame(loop); }
            }
            window.__deckWake = wake;

            /* ---- ③ 标题遮罩：延迟跟随所在内容块的错峰延迟，避免"擦给空气看" ---- */
            function applyMasks(slide) {
                var els = slide.querySelectorAll(TITLE_SEL);
                for (var i = 0; i < els.length; i++) {
                    var el = els[i];
                    if (el.dataset.deckMask) continue;
                    el.dataset.deckMask = '1';
                    var d = 0, p = el.parentElement;
                    while (p && p !== slide) {          /* 找最近一个被入场脚本写过 --d 的祖先 */
                        var v = p.style.getPropertyValue('--d');
                        if (v) { d = parseInt(v, 10) || 0; break; }
                        p = p.parentElement;
                    }
                    el.style.setProperty('--md', Math.min(d, 320) + 'ms');
                    el.classList.add('ed-mask');
                    el.addEventListener('animationend', function h(ev) {
                        if (ev.target !== el) return;
                        el.classList.remove('ed-mask');   /* 交还静态样式，避免 fill 锁死 */
                        el.removeEventListener('animationend', h);
                    });
                }
            }

            function boot() {
                slides = [].slice.call(viewport.querySelectorAll('.slide'));
                if (!slides.length) return;

                if (!('IntersectionObserver' in window)) {
                    live = slides.slice();
                    slides.forEach(function (s) { s.classList.add('deck-live'); });
                    wake(0);
                    return;
                }

                /* 视口白名单：只给在屏的页写变换，上下各留 140px 预热 */
                var io = new IntersectionObserver(function (entries) {
                    entries.forEach(function (en) {
                        var s = en.target, at = live.indexOf(s);
                        if (en.isIntersecting) {
                            if (at < 0) { live.push(s); s.classList.add('deck-live'); }
                            applyMasks(s);
                            wake();
                        } else if (at >= 0) {
                            live.splice(at, 1);
                            s.classList.remove('deck-live');
                        }
                    });
                }, { rootMargin: '140px 0px', threshold: 0 });
                slides.forEach(function (s) { io.observe(s); });

                /* 揭幕时补一次：IO 与入场脚本同帧触发，晚一帧才读得到 --d */
                var mo = new MutationObserver(function (recs) {
                    for (var i = 0; i < recs.length; i++) {
                        var t = recs[i].target;
                        if (t.classList && t.classList.contains('slide') && t.classList.contains('active')) {
                            (function (s) {
                                requestAnimationFrame(function () { applyMasks(s); });
                            })(t);
                        }
                    }
                });
                mo.observe(viewport, { subtree: true, attributes: true, attributeFilter: ['class'] });

                window.addEventListener('scroll', function () { wake(); }, { passive: true });
                window.addEventListener('resize', function () { wake(); });
                wake(0);
            }

            (function wait(n) {
                if (viewport.querySelector('.slide')) { boot(); return; }
                if (n > 400) return;
                requestAnimationFrame(function () { wait(n + 1); });
            })(0);
        })();
    </script>

    <script>
        /* ======================================================================
           HR 主题动态背景 · 人才图谱（Talent Graph）
           ----------------------------------------------------------------------
           画什么（招聘平台语义）：
             ① 岗位节点  直角方块 + 四角角标 + 等宽职位代号 + 在投人数
             ② 候选人节点 圆点，「投递」到距离最近的岗位 —— 这正是招聘平台的匹配关系
             ③ 匹配连线  折线走线（先横后斜），高匹配度用青色提亮
             ④ 匹配脉冲  亮点沿连线流向岗位，抵达时扩散一圈，循环往复
             ⑤ 在招岗位卡 细线卡片（logo 占位 + 职位行 + 技能条）贴左右边缘自下而上漂移
           怎么省：① 只绘 IntersectionObserver 判定「真的可见」的节段，离开即释放画布显存
                   ② 帧率封顶（桌面 ~30fps / 触屏 ~24fps）
                   ③ 标签页隐藏即停，不空转 ④ 降低动效偏好只画一帧静态底
           视差：画布内按节点 depth 施加位移，读滚动进度 q 与共享指针状态 window.__deckPtr。
           ====================================================================== */
        (function () {
            'use strict';

            var viewport = document.getElementById('ppt-viewport');
            if (!viewport) return;

            var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
            /* 环境光级别的缓慢漂移，25fps（触屏 20fps）足够顺滑，把省下的帧预算还给滚动 */
            var STEP = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches) ? 50 : 40;

            /* 调色直接读 :root 设计令牌，不另立一套色板，避免与版式漂移 */
            var rootCS = getComputedStyle(document.documentElement);
            function tok(name, fb) { var v = (rootCS.getPropertyValue(name) || '').trim(); return v || fb; }
            var BLUE = tok('--blue', '#38BDF8');
            var CYAN = tok('--cyan', '#22D3EE');
            var DIM = tok('--dim', '#93A4BF');

            function rgba(hex, a) {
                var h = String(hex).replace('#', '');
                if (h.length === 3) h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2);
                var n = parseInt(h, 16) || 0;
                return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
            }
            function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }

            var W = 1440, H = 810;
            var MONO = '600 10px ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace';

            /* 确定性随机：同一页每次刷新布局一致，不会跳变 */
            function rng(seed) {
                var a = seed >>> 0;
                return function () {
                    a = a + 0x6D2B79F5 | 0;
                    var t = Math.imul(a ^ a >>> 15, 1 | a);
                    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                    return ((t ^ t >>> 14) >>> 0) / 4294967296;
                };
            }

            /* 四个招聘方向，贴近四角，把中部留给正文 */
            var ROLES = [
                { code: 'PRODUCT',  ax: 0.115, ay: 0.170 },
                { code: 'FRONTEND', ax: 0.885, ay: 0.205 },
                { code: 'DATA',     ax: 0.850, ay: 0.820 },
                { code: 'DESIGN',   ax: 0.150, ay: 0.795 }
            ];

            function buildScene(seed) {
                var R = rng(seed);
                var roles = ROLES.map(function (r) {
                    return {
                        code: r.code, bx: r.ax * W, by: r.ay * H, n: 0,
                        ph: R() * 6.283, sp: 0.09 + R() * 0.09, amp: 5 + R() * 6, depth: 0.30 + R() * 0.22
                    };
                });

                var cands = [];
                for (var i = 0; i < 30; i++) {
                    var ang = R() * 6.283;
                    var rad = 0.40 + 0.60 * Math.sqrt(R());          /* 径向外推，中心留白 */
                    var bx = W * 0.5 + Math.cos(ang) * rad * W * 0.60;
                    var by = H * 0.5 + Math.sin(ang) * rad * H * 0.66;

                    var best = 0, bd = 1e9;
                    for (var k = 0; k < roles.length; k++) {
                        var dx = roles[k].bx - bx, dy = roles[k].by - by, d = dx * dx + dy * dy;
                        if (d < bd) { bd = d; best = k; }
                    }
                    roles[best].n++;
                    cands.push({
                        bx: bx, by: by, role: best,
                        r: 1.5 + R() * 1.3,
                        ph: R() * 6.283, sp: 0.12 + R() * 0.22, amp: 7 + R() * 15,
                        depth: 0.45 + R() * 0.55,
                        match: R() < 0.42                          /* 高匹配度 → 连线提亮 */
                    });
                }

                /* 在招岗位卡：贴左右边缘外出血，向上漂移，不压版心 */
                var lanes = [
                    { x: -34,  w: 196, sp: 1 / 27, ph: 0.00 },
                    { x: -78,  w: 178, sp: 1 / 34, ph: 0.55 },
                    { x: 1296, w: 196, sp: 1 / 30, ph: 0.25 },
                    { x: 1340, w: 178, sp: 1 / 38, ph: 0.78 }
                ];
                var cards = lanes.map(function (L) {
                    return {
                        x: L.x, w: L.w, h: 104, sp: L.sp, ph: L.ph, depth: 0.8 + R() * 0.4,
                        l1: 88 + R() * 34, l2: 56 + R() * 28, l3: 100 + R() * 40,
                        s1: (L.w - 32) * (0.50 + R() * 0.40),
                        s2: (L.w - 32) * (0.28 + R() * 0.40)
                    };
                });

                return { R: R, roles: roles, cands: cands, cards: cards, pulses: [], nextAt: 700 + R() * 1200 };
            }

            function drawOne(slide, t) {
                var cv = slide.__talentCv, sc = slide.__talentSc;
                if (!cv || !sc) return;

                var F = slide.__talentF || 1;
                var bw = Math.round(W * F), bh = Math.round(H * F);
                if (cv.width !== bw || cv.height !== bh) { cv.width = bw; cv.height = bh; }
                var ctx = cv.getContext('2d');
                if (!ctx) return;
                ctx.setTransform(F, 0, 0, F, 0, 0);
                ctx.clearRect(0, 0, W, H);
                ctx.lineWidth = 1;

                var rect = slide.getBoundingClientRect();
                var q = clamp(rect.top / (rect.height || window.innerHeight), -1, 1);
                var p = window.__deckPtr || { x: 0, y: 0 };
                var OX = p.x * 24, OY = p.y * 16 - q * 46;
                var tt = reduce ? 0 : t / 1000;

                var i, n, role;
                /* 位置一次性算好：节点漂移 + 分层视差（近层走得快） */
                for (i = 0; i < sc.cands.length; i++) {
                    n = sc.cands[i];
                    n._x = n.bx + Math.sin(tt * n.sp + n.ph) * n.amp + OX * (0.35 + n.depth);
                    n._y = n.by + Math.cos(tt * n.sp * 0.83 + n.ph) * n.amp * 0.72 + OY * (0.35 + n.depth);
                }
                for (i = 0; i < sc.roles.length; i++) {
                    role = sc.roles[i];
                    role._x = role.bx + Math.sin(tt * role.sp + role.ph) * role.amp + OX * (0.35 + role.depth);
                    role._y = role.by + Math.cos(tt * role.sp * 0.9 + role.ph) * role.amp * 0.7 + OY * (0.35 + role.depth);
                }

                /* ① 在招岗位卡（最远层，先画） */
                for (i = 0; i < sc.cards.length; i++) {
                    var cd = sc.cards[i];
                    var u = reduce ? 0.5 : ((tt * cd.sp) + cd.ph) % 1;
                    var al = Math.sin(Math.PI * u) * 0.075;
                    if (al <= 0.005) continue;
                    var ccy = H + 130 - u * (H + 300) + OY * (0.35 + cd.depth) * 0.5;
                    var ccx = cd.x + OX * (0.35 + cd.depth) * 0.5;
                    ctx.strokeStyle = rgba(DIM, al * 1.6);
                    ctx.strokeRect(ccx + .5, ccy + .5, cd.w, cd.h);
                    ctx.fillStyle = rgba(BLUE, al * 2.4);
                    ctx.fillRect(ccx + 16.5, ccy + 16.5, 18, 18);
                    ctx.strokeStyle = rgba(DIM, al * 3.2);
                    ctx.beginPath();
                    ctx.moveTo(ccx + 44.5, ccy + 19.5); ctx.lineTo(ccx + 44.5 + cd.l2, ccy + 19.5);
                    ctx.moveTo(ccx + 44.5, ccy + 29.5); ctx.lineTo(ccx + 44.5 + cd.l2 * 0.66, ccy + 29.5);
                    ctx.moveTo(ccx + 16.5, ccy + 46.5); ctx.lineTo(ccx + 16.5 + cd.l1, ccy + 46.5);
                    ctx.moveTo(ccx + 16.5, ccy + 58.5); ctx.lineTo(ccx + 16.5 + cd.l3, ccy + 58.5);
                    ctx.moveTo(ccx + 16.5, ccy + 70.5); ctx.lineTo(ccx + 16.5 + cd.l3 * 0.7, ccy + 70.5);
                    ctx.stroke();
                    ctx.fillStyle = rgba(CYAN, al * 2.6);
                    ctx.fillRect(ccx + 16.5, ccy + 84.5, cd.s1, 3);
                    ctx.fillRect(ccx + 16.5, ccy + 92.5, cd.s2, 3);
                }

                /* ② 匹配连线：候选人 → 归组岗位，先横后斜的走线 */
                for (i = 0; i < sc.cands.length; i++) {
                    n = sc.cands[i];
                    role = sc.roles[n.role];
                    var xm = n._x + (role._x - n._x) * 0.45;
                    ctx.strokeStyle = rgba(n.match ? CYAN : DIM, n.match ? 0.155 : 0.062);
                    ctx.beginPath();
                    ctx.moveTo(n._x, n._y);
                    ctx.lineTo(xm, n._y);
                    ctx.lineTo(role._x, role._y);
                    ctx.stroke();
                }

                /* ③ 候选人节点 */
                for (i = 0; i < sc.cands.length; i++) {
                    n = sc.cands[i];
                    ctx.fillStyle = rgba(n.match ? CYAN : BLUE, n.match ? 0.30 : 0.17);
                    ctx.beginPath();
                    ctx.arc(n._x, n._y, n.r, 0, 6.2832);
                    ctx.fill();
                }

                /* ④ 岗位节点：直角方块 + 四角角标 + 职位代号 + 在投人数 */
                ctx.font = MONO;
                ctx.textBaseline = 'middle';
                for (i = 0; i < sc.roles.length; i++) {
                    role = sc.roles[i];
                    var s = 7;
                    ctx.strokeStyle = rgba(BLUE, 0.34);
                    ctx.strokeRect(role._x - s + .5, role._y - s + .5, s * 2, s * 2);
                    ctx.beginPath();
                    ctx.moveTo(role._x - s - 4.5, role._y - s + 2.5);
                    ctx.lineTo(role._x - s - 4.5, role._y - s - 4.5);
                    ctx.lineTo(role._x - s + 2.5, role._y - s - 4.5);
                    ctx.moveTo(role._x + s + 4.5, role._y + s - 2.5);
                    ctx.lineTo(role._x + s + 4.5, role._y + s + 4.5);
                    ctx.lineTo(role._x + s - 2.5, role._y + s + 4.5);
                    ctx.strokeStyle = rgba(BLUE, 0.44);
                    ctx.stroke();
                    ctx.fillStyle = rgba(DIM, 0.32);
                    ctx.fillText(role.code, role._x + s + 11, role._y - 5.5);
                    ctx.fillStyle = rgba(BLUE, 0.36);
                    ctx.fillText(role.n + ' 人在投', role._x + s + 11, role._y + 8.5);
                }

                /* ⑤ 匹配脉冲：亮点沿线流向岗位，抵达时扩散一圈 */
                if (!reduce) {
                    if (t > sc.nextAt) {
                        sc.pulses.push({ n: sc.cands[(sc.R() * sc.cands.length) | 0], t0: t, dur: 1100 + sc.R() * 700 });
                        sc.nextAt = t + 700 + sc.R() * 1500;
                    }
                    for (i = sc.pulses.length - 1; i >= 0; i--) {

    /* 正面 + 背面（背面去饱和压暗），并叠一层胶片颗粒 */
    function buildTextures() {
        var front = [], back = [], i;
        for (i = 0; i < ART.length; i++) {
            var c = mkc(TS, TS), x = c.getContext('2d');
            ART[i](x);
            x.save();
            x.globalCompositeOperation = 'overlay';
            x.globalAlpha = 0.15;
            x.fillStyle = x.createPattern(grainTile, 'repeat');
            x.fillRect(0, 0, TS, TS);
            x.restore();
            front.push(c);

            var d = mkc(TS, TS), y = d.getContext('2d');
            y.drawImage(c, 0, 0);
            y.globalCompositeOperation = 'saturation';
            y.fillStyle = 'rgba(128,128,128,0.2)'; y.fillRect(0, 0, TS, TS);
            y.globalCompositeOperation = 'multiply';
            y.fillStyle = 'rgba(6,8,18,0.75)'; y.fillRect(0, 0, TS, TS);
            back.push(d);
        }
        return { front: front, back: back };
    }

    /* ---------- 轨道基向量 ---------- */
    var U, V, AXIS;
    function rebuild() {
        var ax = PC.axis * Math.PI / 180, cf = clamp(PC.ratio, 0.08, 0.95), sf = Math.sqrt(1 - cf * cf);
        U = [Math.cos(ax), Math.sin(ax), 0];
        V = [-Math.sin(ax) * cf, Math.cos(ax) * cf, sf];
        AXIS = [U[1] * V[2] - U[2] * V[1], U[2] * V[0] - U[0] * V[2], U[0] * V[1] - U[1] * V[0]];
    }
    rebuild();

    /* ---------- 画布（CSS 尺寸 = 1440×810；位图 = 设计单位 × f） ---------- */
    var cv = null, ctx = null;
    var W = 0, H = 0, K = 1, f = 1, DPR = 1;
    var headLayer = null, headInk = null, TEX = null;

    function d2sx(x) { return x * K; }
    function d2sy(y) { return y * K; }

    /* 让文字的「着墨高度」等于目标 cap，并把着墨宽度缩放到 targetW */
    function fitText(x, str, font, weight, cap, cx, capTop, targetW, color) {
        var probe = 100;
        x.font = weight + ' ' + probe + 'px ' + font;
        var m0 = x.measureText(str);
        var ratio = (m0.actualBoundingBoxAscent || 72) / probe;
        var size = cap / (ratio || 0.72);
        x.font = weight + ' ' + size + 'px ' + font;
        var mm = x.measureText(str);
        var inkW = (mm.actualBoundingBoxRight || mm.width) + (mm.actualBoundingBoxLeft || 0);
        var sx = targetW ? targetW / inkW : 1;
        x.save();
        x.fillStyle = color;
        x.textBaseline = 'alphabetic';
        x.textAlign = 'center';
        x.translate(cx, capTop + cap);
        x.scale(sx, 1);
        x.fillText(str, 0, 0);
        x.restore();
        return inkW * sx;
    }

    function buildHead() {
        if (!W || !H) return;
        headLayer = mkc(W, H);
        var x = headLayer.getContext('2d');
        var rows = LAY.head, gap = LAY.gap, i, total = 0, maxW = 0;
        for (i = 0; i < rows.length; i++) {
            total += rows[i].cap; if (i) total += gap;
            if (rows[i].w > maxW) maxW = rows[i].w;
        }
        var y = LAY.cy - total / 2, yTop = y;
        for (i = 0; i < rows.length; i++) {
            fitText(x, rows[i].s, SANS, '700', rows[i].cap * K, d2sx(LAY.cx), d2sy(y), rows[i].w * K, rows[i].fill);
            y += rows[i].cap + gap;
        }
        /* ★ 标题层的「着墨盒」（画布像素坐标）：每帧只合成这一块。
           整层是全画布尺寸，但标题只占中间一条横带 —— 实测 1440×810 的画布里
           着墨区只有 797×158（设计单位），也就是说 **87% 的全屏混合是纯透明的白写**。
           在 2K+系统缩放的环境下画布涨到 2880×1620，这一项单帧就要写掉 4.7M 像素，
           占全部填充预算的三分之一。裁掉后画的还是同一张位图、同一批像素，
           画面**一个像素都不变**。
           pad = 12 设计单位：给抗锯齿、字面左右外扩和不同字体的侧边留白。 */
        var pad = Math.ceil(12 * K);
        var bw = Math.ceil(maxW * K) + pad * 2;
        var bh = Math.ceil(total * K) + pad * 2;
        var bx = Math.max(0, Math.min(W - 1, Math.round(d2sx(LAY.cx) - bw / 2)));
        var by = Math.max(0, Math.min(H - 1, Math.round(d2sy(yTop) - pad)));
        headInk = { x: bx, y: by,
                    w: Math.max(1, Math.min(W - bx, bw)),
                    h: Math.max(1, Math.min(H - by, bh)) };
    }

    function project(p) {
        var k = LAY.a * K * RING.dist / (RING.dist - p[2]);
        return [d2sx(OCX) + k * p[0], d2sy(OCY) + k * p[1], k];
    }

    function drawTile(i, psi) {
        var c = Math.cos(psi), s = Math.sin(psi);
        var C = [c * U[0] + s * V[0], c * U[1] + s * V[1], c * U[2] + s * V[2]];
        var T = [-s * U[0] + c * V[0], -s * U[1] + c * V[1], -s * U[2] + c * V[2]];
        var h = RING.tile / (2 * LAY.a);
        var p0 = project(C);
        var pT = project([C[0] + T[0] * h, C[1] + T[1] * h, C[2] + T[2] * h]);
        var pA = project([C[0] + AXIS[0] * h, C[1] + AXIS[1] * h, C[2] + AXIS[2] * h]);
        var ex = pT[0] - p0[0], ey = pT[1] - p0[1];
        var fx = pA[0] - p0[0], fy = pA[1] - p0[1];
        if (Math.abs(ex * fy - ey * fx) < 0.4) return;      /* 侧到看不见，跳过 */

        var img = (C[2] > 0 ? TEX.front : TEX.back)[i % TEX.front.length];
        ctx.save();
        ctx.setTransform(ex * 2 / TS, ey * 2 / TS, fx * 2 / TS, fy * 2 / TS, p0[0], p0[1]);
        roundRectPath(ctx, TS, TS, TS * RING.radius);
        ctx.clip();
        ctx.drawImage(img, -TS / 2, -TS / 2, TS, TS);
        ctx.restore();
        ctx.setTransform(1, 0, 0, 1, 0, 0);
    }

    /* 合成标题层 —— 只贴「着墨盒」那一块，而不是全画布。
       headInk 为空（理论上只在 resize 的极短窗口里）时退回全屏，保证不会少画。 */
    function blitHead() {
        if (!headLayer) return;
        var b = headInk;
        if (!b) { ctx.drawImage(headLayer, 0, 0); return; }
        ctx.drawImage(headLayer, b.x, b.y, b.w, b.h, b.x, b.y, b.w, b.h);
    }

    function render() {
        if (!ctx) return;
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, W, H);
        ctx.imageSmoothingQuality = 'high';

        var list = [], i, psi;
        for (i = 0; i < RING.n; i++) {
            psi = RING.phase * Math.PI / 180 - i * 2 * Math.PI / RING.n + spin;
            var c = Math.cos(psi), s = Math.sin(psi);
            list.push({ i: i, psi: psi, z: c * U[2] + s * V[2] });
        }
        list.sort(function (a, b) { return a.z - b.z; });

        /* 后半圈先画，穿过 z=0 的那一刻把标题插进去，再画前半圈
           —— 标题两端被近侧板块压住、中段从远侧板块前面穿过。 */
        var drawn = false;
        for (i = 0; i < list.length; i++) {
            if (!drawn && list[i].z > 0) { blitHead(); drawn = true; }
            if (TEX) drawTile(list[i].i, list[i].psi);
        }
        if (!drawn) blitHead();
    }

    /* ---------- 时钟：持续转动 ---------- */
    var last = 0, raf = 0, frames = 0, fps = 0, fpsT = 0, fpsN = 0;
    var visible = false, booted = false;

    function step(dt) {
        var kk = 1 - Math.pow(0.0015, dt);
        PC.axis += (PT.axis - PC.axis) * kk;
        PC.ratio += (PT.ratio - PC.ratio) * kk;
        PC.dx += (PT.dx - PC.dx) * kk;
        PC.dy += (PT.dy - PC.dy) * kk;
        if (Math.abs(PC.axis - PT.axis) > 0.02 || Math.abs(PC.ratio - PT.ratio) > 0.0008) rebuild();

        ptX += (ptXT - ptX) * Math.min(1, dt * 6);
        ptY += (ptYT - ptY) * Math.min(1, dt * 6);

        /* 指针手感输入衰减（只衰减"额外的那部分"，基准永不衰减） */
        spd *= Math.pow(0.055, dt);
        var want = SUSTAIN_W + (WMAX - SUSTAIN_W) * (1 - Math.exp(-spd / SPD_REF));
        wNow += (want - wNow) * (1 - Math.pow(0.006, dt));
        vel = Math.min(wNow, WMAX);
        if (vel < SUSTAIN_W) vel = SUSTAIN_W;        /* 硬下限：永不静止 */
        spin += vel * dt * DIR;

        eng *= Math.pow(0.20, dt);
        var amp = 34 + eng * 18, d = Math.sin(spin * 0.85);
        OCX = LAY.cx + PC.dx * d * amp + ptX * 22;
        OCY = LAY.cy + PC.dy * d * amp + ptY * 14;
    }

    /* ---------- 时钟：持续转动 ---------- */
    /* ftAvg = 帧间隔的移动平均（毫秒），**只用于诊断** —— 打开页面读一下
       `__deckRing.state().ftAvg` 就知道这台机器在这张画布上跑不跑得动。
       ★ 这里曾经试过"帧率吃紧就隔帧渲染"，实测后**拆掉了**。原因值得记下来：
         在无 vsync 限制的环境里它把 rAF 计数从 40 抬到 80，看着像翻倍，但那是假象
         —— rAF 回调变快了、而 render 次数没变（每 2 帧才画 1 次），**画面更新率
         一次都没提高**；到了真机（有 vsync）上，rAF 被锁在刷新率，隔帧只会把视觉
         帧率从 40 压到 30，**更顿**。真正有效的是减少**每帧的绘制量**（见 blitHead）。 */
    var ftAvg = 16.7;

    function frame(now) {
        raf = 0;
        if (!visible || document.hidden) return;
        if (!last) { last = now; raf = requestAnimationFrame(frame); return; }
        var raw = now - last;
        var dt = Math.min(raw / 1000, 0.05);
        last = now;
        ftAvg += (raw - ftAvg) * 0.05;
        frames++; fpsN++;
        if (now - fpsT > 1000) { fps = fpsN * 1000 / (now - fpsT); fpsT = now; fpsN = 0; }
        step(dt);
        render();
        raf = requestAnimationFrame(frame);
    }
    function wake() {
        /* 注意：这里**不能**再判 reduce。低动效偏好下环也要转 —— 只要还有别的条件
           （raf 已在跑、被滚出视口、标签页隐藏）就正常休眠。 */
        if (raf || !visible || document.hidden) return;
        last = 0;
        raf = requestAnimationFrame(frame);
    }
    function sleep() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }

    /* ---------- 指针：速度 → 额外转速 ---------- */
    window.addEventListener('pointermove', function (e) {
        var t = e.timeStamp || performance.now();
        var dtms = lpT ? (t - lpT) : 0;
        ptXT = e.clientX / window.innerWidth - 0.5;
        ptYT = e.clientY / window.innerHeight - 0.5;
        if (visible && lpX !== null && dtms > 0 && dtms < 400) {
            var v = (Math.abs(e.clientX - lpX) + Math.abs(e.clientY - lpY)) / (dtms / 1000);
            spd = spd * 0.45 + Math.min(v, 6000) * 0.55;
        }
        lpX = e.clientX; lpY = e.clientY; lpT = t;
        wake();
    }, { passive: true });
    window.addEventListener('pointerleave', function () { lpX = lpY = null; lpT = 0; }, { passive: true });

    window.addEventListener('keydown', function (e) {
        if (e.key >= '1' && e.key <= '4') {
            var i = parseInt(e.key, 10) - 1;
            vi = i;
            PT.axis = VARIANTS[i].axis; PT.ratio = VARIANTS[i].ratio;
            PT.dx = VARIANTS[i].dx; PT.dy = VARIANTS[i].dy;
            DIR = VARIANTS[i].dir;
            wake();
        }

    /* ---------- 尺寸：随 --deck-s 与 dpr 走 ---------- */
    function deckScale() {
        var s = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--deck-s'));
        return (isFinite(s) && s > 0) ? s : 1;
    }
    function resize() {
        if (!cv) return;
        DPR = Math.min(window.devicePixelRatio || 1, 2);
        f = clamp(deckScale() * DPR, 1, 2);
        W = Math.round(DW * f);
        H = Math.round(DH * f);
        cv.width = W; cv.height = H;
        K = f;
        buildHead();
        if (TEX) render(); else if (visible) wake();
    }
    var rzT = 0;
    window.addEventListener('resize', function () {
        clearTimeout(rzT);
        rzT = setTimeout(resize, 120);
    });

    /* ---------- 启动 ---------- */
    function boot(slide) {
        cv = document.getElementById('ringStage');
        if (!cv) return;
        ctx = cv.getContext('2d');
        booted = true;
        resize();

        if ('IntersectionObserver' in window) {
            new IntersectionObserver(function (ents) {
                var en = ents[0];
                visible = !!(en.isIntersecting && en.intersectionRatio > 0.12);
                if (visible) wake(); else sleep();
            }, { threshold: [0, 0.12, 0.5] }).observe(slide);
        } else {
            visible = true;
        }
        /* IO 首次回调可能晚一帧：先按几何判一次，保证一进页面就在转 */
        var r = slide.getBoundingClientRect();
        if (r.top < window.innerHeight && r.bottom > 0) { visible = true; wake(); }

        /* 纹理生成较重，放到首帧之后，避免拖慢封面文字出现 */
        setTimeout(function () { TEX = buildTextures(); render(); wake(); }, 0);
    }

    /* 封面页（slides[0]）打一个标记类：注入样式里的「简洁化」规则要给它开例外 ——
       星环封面按要求一字不动，光晕呼吸 / 方格纸 / 重暗角原样保留，只精简第 2–20 页。
       ★ 类名绝不能用 ed-cover：底本自己就有一条 `.ed-cover { position:absolute;
         left:508px; right:88px; top:122px }` 的布局规则（它自己那页在用）。撞名之后
         `.slide` 会命中它，position/left 被 `.slide` 的 !important 顶掉、但 `right:88px`
         活了下来 —— 在 position:relative 下等价于把整页**左推 88px**，封面看着"没居中"。
         所以这里用底本不存在的 deck-cover。 */
    (function wait(n) {
        var s = viewport.querySelector('.slide');
        if (s) { s.classList.add('deck-cover'); boot(s); return; }
        if (n > 400) return;
        requestAnimationFrame(function () { wait(n + 1); });
    })(0);

    document.addEventListener('visibilitychange', function () { if (!document.hidden) wake(); });

    /* 保险丝：万一 IntersectionObserver 没回调到，或某次 sleep/wake 组合把循环卡住
       （被嵌进预览面板、从后台切回、尺寸异常等），每 2 秒自检一次 —— 只要画布真的在屏
       就唤醒。循环正常跑时这里第一句就返回，不产生任何开销。 */
    setInterval(function () {
        if (!booted || raf || document.hidden || !cv) return;
        var r = cv.getBoundingClientRect();
        if (r.bottom > 0 && r.top < window.innerHeight && r.width > 0) { visible = true; wake(); }
    }, 2000);

    if (document.fonts && document.fonts.ready && document.fonts.ready.then) {
        document.fonts.ready.then(function () { buildHead(); render(); });   /* 字体到位后重排标题 */
    }

    /* ---------- 对外接口（截图 / 自动化验证 / 参数标定） ---------- */
    /* 标定用：把「前半圈（z>0）的板」单独画一遍，量出它们在给定矩形（设计坐标）内的侵占。
       用来定环半径与标题字号 —— 保证标题两端只是被板擦到、不会被吞掉整字。 */
    function measureFront(t, box, variantNow) {
        var keep = spin;
        if (typeof variantNow === 'number') applyVariantNow(variantNow);
        spin = t;
        var list = [], i, psi, c, s;
        for (i = 0; i < RING.n; i++) {
            psi = RING.phase * Math.PI / 180 - i * 2 * Math.PI / RING.n + spin;
            c = Math.cos(psi); s = Math.sin(psi);
            list.push({ i: i, psi: psi, z: c * U[2] + s * V[2] });
        }
        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.clearRect(0, 0, W, H);
        for (i = 0; i < list.length; i++) if (list[i].z > 0) drawTile(list[i].i, list[i].psi);

        var x0 = Math.round(box.x * f), y0 = Math.round(box.y * f);
        var w0 = Math.max(1, Math.round(box.w * f)), h0 = Math.max(1, Math.round(box.h * f));
        var d = ctx.getImageData(x0, y0, w0, h0).data;
        var nc = box.chars, cov = [], k, x, y, xa, xb, hit, tot;
        /* 逐字覆盖率：把着墨盒按字数等分，逐格统计「被版材盖住」的像素占比。
           1.0 = 整字被吞；0.3~0.6 = 左肩被啃（招牌观感）；0 = 完全没碰到。 */
        for (k = 0; k < nc; k++) {
            xa = Math.floor(k * w0 / nc);
            xb = Math.max(xa + 1, Math.floor((k + 1) * w0 / nc));
            hit = 0; tot = 0;
            for (x = xa; x < xb; x++) {
                for (y = 0; y < h0; y++) { tot++; if (d[(y * w0 + x) * 4 + 3] > 8) hit++; }
            }
            cov.push(tot ? hit / tot : 0);
        }
        var tw = 0;
        for (x = 0; x < w0; x++) {
            for (y = 0; y < h0; y++) if (d[(y * w0 + x) * 4 + 3] > 8) { tw++; break; }
        }
        spin = keep;
        render();
        return { inkPct: +(tw / w0 * 100).toFixed(1), cov: cov, chars: nc, s: box.s };
    }

    function applyVariantNow(i) {
        vi = i;
        PC.axis = PT.axis = VARIANTS[i].axis;
        PC.ratio = PT.ratio = VARIANTS[i].ratio;
        PC.dx = PT.dx = VARIANTS[i].dx;
        PC.dy = PT.dy = VARIANTS[i].dy;
        DIR = VARIANTS[i].dir;
        rebuild();
    }

    window.__deckRing = {
        measure: measureFront,
        variantNow: applyVariantNow,
        /* 标定时临时改环半径 / 板材边长 / 标题行高与行宽（不落盘，仅内存） */
        tune: function (o) {
            if (o.a) LAY.a = o.a;
            if (o.tile) RING.tile = o.tile;
            if (o.n) RING.n = o.n;
            if (o.cap) { LAY.head[0].cap = o.capO || o.cap; LAY.head[1].cap = o.cap; }
            if (o.w) LAY.head[1].w = o.w;
            if (o.wO) LAY.head[0].w = o.wO;
            WMAX = clamp(60 * 0.045 * RING.tile / LAY.a, 0.5, 2.2);
            buildHead(); render();
            return { a: LAY.a, tile: RING.tile, cap: LAY.head[1].cap, w: LAY.head[1].w, wmax: WMAX };
        },
        /* 某一行的着墨盒（设计坐标） */
        headBox: function (i) {
            var rows = LAY.head, gap = LAY.gap, total = 0, k, y;
            for (k = 0; k < rows.length; k++) { total += rows[k].cap; if (k) total += gap; }
            y = LAY.cy - total / 2;
            for (k = 0; k < i; k++) y += rows[k].cap + gap;
            var r = rows[i];
            return { x: LAY.cx - r.w / 2, y: y, w: r.w, h: r.cap, chars: r.s.length, s: r.s };
        },
        seek: function (t) {
            spin = ((t % 14) + 14) % 14 / 14 * Math.PI * 2;
            spd = 0; wNow = vel = SUSTAIN_W;
            render();
        },
        variant: function (i) {
            if (i < 0 || i >= VARIANTS.length) return;
            vi = i;
            PT.axis = VARIANTS[i].axis; PT.ratio = VARIANTS[i].ratio;
            PT.dx = VARIANTS[i].dx; PT.dy = VARIANTS[i].dy;
            DIR = VARIANTS[i].dir;
        },
        state: function () {
            return {
                spin: spin, vel: vel, sustain: SUSTAIN_W, wmax: WMAX, spd: spd, eng: eng,
                spinSecPerTurn: Math.PI * 2 / Math.max(vel, 1e-9),
                variant: VARIANTS[vi].id, axis: PC.axis, ratio: PC.ratio,
                W: W, H: H, f: f, dpr: DPR, frames: frames, fps: fps,
                ftAvg: Math.round(ftAvg * 10) / 10, headInk: headInk,
                visible: visible, booted: booted, reduce: reduce,
                motion: MOTION.state(),
                layout: DW + 'x' + DH, a: LAY.a, tile: RING.tile, n: RING.n,
                head: LAY.head.map(function (r) { return r.s; })
            };
        }
    };
})();
</script>
<script id="deck-flip-js">
/* ==========================================================================
   点屏翻页（取代「上一页 / 下一页」两个按钮）
   · 点击画面任意处 → 下一页；末页再点 → 回到封面（循环）；Shift+点击 / ←↑ 回上一页
   · 过渡：旧页淡出上移、新页自下方浮起（叠层淡入上浮）—— 没有旋转、没有冲击波、
     没有闪白、没有镜头抖动。520ms 一次过，字形全程不变形。
   · 做法：把相邻两页的 1440×810 内容块临时搬进一个固定定位的舞台（上下叠两层），
     翻转播放时舞台盖住整屏；落定后先把文档滚到目标页（此时仍被舞台遮住）、再把内容块
     放回各自的 .slide —— 全程只动内容块、不动 .slide 本身，所以文档高度与滚动位置不受影响。
   ========================================================================== */
(function () {
    'use strict';

    var viewport = document.getElementById('ppt-viewport');
    if (!viewport) return;

    /* ---------- 动效强度 ----------
       翻页过渡现在只剩一个 520ms 的淡入上浮，本身已经克制到不需要分级，
       所以这里不再读动效偏好（完整模式与柔和模式在翻页上完全一致）。
       入场 / 视差的强度策略仍在 <head> 的 __deckMotion 里，由底本脚本消费。 */
    var DUR = 520;          /* 与 CSS 的 --flip-dur 一致 */
    var busy = false;

    function list() { return [].slice.call(viewport.querySelectorAll('.slide')); }

    function currentIndex(slides) {
        var mid = window.innerHeight * .42, best = 0, bd = Infinity;
        for (var i = 0; i < slides.length; i++) {
            var r = slides[i].getBoundingClientRect();
            if (r.top <= mid && r.bottom >= mid) return i;
            var d = Math.abs(r.top - mid);
            if (d < bd) { bd = d; best = i; }
        }
        return best;
    }

    /* 瞬时跳转：html 上有 scroll-behavior:smooth，这里临时关掉再还原 */
    function jumpTo(el) {
        if (!el) return;
        var html = document.documentElement;
        var sb = html.style.scrollBehavior;
        html.style.scrollBehavior = 'auto';
        window.scrollTo(0, el.getBoundingClientRect().top + window.pageYOffset);
        html.style.scrollBehavior = sb;
    }

    function markActive(s) {
        if (s && !s.classList.contains('active')) s.classList.add('active');
    }

    function step(dir) {
        var s = list();
        if (s.length < 2 || busy) return;
        var from = currentIndex(s);
        var to = from + (dir < 0 ? -1 : 1);
        if (to >= s.length) to = 0;
        if (to < 0) to = s.length - 1;
        if (to === from) return;
        /* 一律走 flip()：过渡与动效偏好无关（曾经在低动效偏好下直接瞬移，是 bug） */
        flip(s[from], s[to], dir < 0 ? -1 : 1);
    }

    function flip(a, b, dir) {
        var ca = a.firstElementChild, cb = b.firstElementChild;
        if (!ca || !cb) { markActive(b); jumpTo(b); return; }
        busy = true;

        /* 滚动视差会写 --deck-zoom；翻页期间先归 1，落定后再还回去 */
        var za = ca.style.getPropertyValue('--deck-zoom');
        var zb = cb.style.getPropertyValue('--deck-zoom');
        ca.style.setProperty('--deck-zoom', '1');
        cb.style.setProperty('--deck-zoom', '1');

        /* 目标页在过渡开始时就置为 active。紧接着把它内部的入场类摘掉 ——
           摘掉 = 「入场已完成」的终态：整页已经在做淡入上浮，内容不必再各动一次；
           同时避免搬运瞬间 .ed-anim 的 opacity:0 让内容闪一下空白。 */
        markActive(b);
        [].forEach.call(cb.querySelectorAll('.ed-anim, .ed-anim-fade, .ed-mask'), function (el) {
            el.classList.remove('ed-anim', 'ed-anim-fade', 'ed-mask');
        });

        /* 叠层：A 面（旧页）在下、B 面（新页）在上，两层共用同一套 --deck-s 几何。
           `.rev`（回上一页）时方向翻转：旧页往下走、新页从上方浮下来。 */
        var stage = document.createElement('div');
        stage.className = 'deck-flip' + (dir < 0 ? ' rev' : '');
        stage.setAttribute('aria-hidden', 'true');
        stage.innerHTML =
            '<div class="deck-flip-face deck-flip-a"></div>' +
            '<div class="deck-flip-face deck-flip-b"></div>';
        document.body.appendChild(stage);

        var faceB = stage.querySelector('.deck-flip-b');
        stage.querySelector('.deck-flip-a').appendChild(ca);
        faceB.appendChild(cb);

        function noScroll(e) { e.preventDefault(); }
        window.addEventListener('wheel', noScroll, { passive: false });
        window.addEventListener('touchmove', noScroll, { passive: false });

        var landed = false;
        function land() {
            if (landed) return;
            landed = true;

            jumpTo(b);                                   /* ① 舞台仍盖着整屏：先跳滚动 */
            a.appendChild(ca); b.appendChild(cb);         /* ② 内容块还回各自的页 */
            if (za) ca.style.setProperty('--deck-zoom', za); else ca.style.removeProperty('--deck-zoom');
            if (zb) cb.style.setProperty('--deck-zoom', zb); else cb.style.removeProperty('--deck-zoom');
            if (stage.parentNode) stage.parentNode.removeChild(stage);   /* ③ 同一帧内撤舞台 */

            window.removeEventListener('wheel', noScroll);
            window.removeEventListener('touchmove', noScroll);
            busy = false;
            if (window.__deckWake) window.__deckWake();
        }

        /* 两帧后再起跑：保证初始态（opacity:0 / translateY(14px)）已被应用，transition 才会跑 */
        requestAnimationFrame(function () {
            requestAnimationFrame(function () {
                stage.classList.add('run');
            });
        });
        /* 新页浮到位的瞬间即「落定」—— 动画结束事件为准，超时兜底 */
        faceB.addEventListener('transitionend', function (ev) {
            if (ev.propertyName === 'opacity' || ev.propertyName === 'transform') land();
        });
        setTimeout(land, DUR + 260);
    }

    /* ---------- 点击画面翻页 ---------- */
    document.addEventListener('click', function (e) {
        if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.altKey) return;
        var t = e.target;
        if (!t || !t.closest) return;
        /* 章节导航 / 目录行 / 链接等自带语义的元素除外 */
        if (t.closest('a, button, input, select, textarea, [data-goto], .deck-nav, .deck-flip')) return;
        step(e.shiftKey ? -1 : 1);
    }, false);

    /* ---------- 键盘（← → ↑ ↓ 空格 PgUp/PgDn Home/End） ---------- */
    window.addEventListener('keydown', function (e) {
        if (e.defaultPrevented || e.metaKey || e.ctrlKey || e.altKey) return;
        var t = e.target;
        if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
        var k = e.key;
        if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === ' ' || k === 'Spacebar') {
            e.preventDefault(); step(1);
        } else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp') {
            e.preventDefault(); step(-1);
        } else if (k === 'Home') {
            e.preventDefault(); var s = list(); markActive(s[0]); jumpTo(s[0]);
        } else if (k === 'End') {
            e.preventDefault(); var s2 = list(); markActive(s2[s2.length - 1]); jumpTo(s2[s2.length - 1]);
        }
    });

    /* ---------- 对外接口（自动化验证） ---------- */
    window.__deckNav = {
        step: step,
        current: function () { return currentIndex(list()); },
        total: function () { return list().length; },
        busy: function () { return busy; }
    };
})();
</script>
</body>
</html>
