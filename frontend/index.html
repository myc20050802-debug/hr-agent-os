<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR-Agent OS · 招聘全链路 AI Agent 平台</title>
    <!-- 字体：渐进增强，绝不阻塞首屏。
         media="print" 让这张样式表不参与渲染阻塞，加载成功后再切回 all。
         访问不到 Google Fonts（例如中国大陆）时会静默回落到下面的系统字体栈，不会白屏。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" media="print" onload="this.media='all'"
          href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Inter:wght@300;400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&family=Inter:wght@300;400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap">
    </noscript>
    <style>
        :root {
            --primary-color: #38BDF8;
            --accent-color-1: #22D3EE;
            --accent-color-2: #FBBF24;
            --neutral-color: #94A3B8;
            --slide-background: #060910;
            --font-title: 'Montserrat', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Source Han Sans SC', system-ui, sans-serif;
            --font-body: 'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', 'Source Han Sans SC', system-ui, sans-serif;
        }
    </style>
    <style id="deck-theme">
        /* ==========================================================================
           Editorial Dark —— 作品集统一版式系统
           设计取向：杂志编辑部式的排版（发丝线 / 超大数字 / 非对称网格 / 大量留白），
           而不是「一堆圆角卡片」。底色近黑，冷色（蓝/青）承担结构，暖色只用于情绪与红线。
           ========================================================================== */
        :root {
            --ink: #060910;
            --ink2: #0B121F;
            --ink3: #0F1728;
            --paper: #F2F6FF;
            --dim: #93A4BF;
            --mute: #5A6A85;
            --faint: #39445A;
            --line: rgba(147, 166, 196, .16);
            --line2: rgba(147, 166, 196, .30);
            --blue: #38BDF8;
            --cyan: #22D3EE;
            --amber: #FBBF24;
            --ember: #FF6B4A;
        }

        .ed-page {
            width: 1440px;
            height: 810px;
            position: relative;
            overflow: hidden;
            background: var(--ink);
            color: var(--paper);
            font-family: var(--font-body);
            font-synthesis: none;
        }

        /* ---------- 底纹：方格纸 + 光晕 + 暗角 ---------- */
        .ed-grid {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(120, 160, 220, .05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(120, 160, 220, .05) 1px, transparent 1px);
            background-size: 72px 72px;
            -webkit-mask-image: radial-gradient(125% 95% at 50% 42%, #000 30%, transparent 100%);
            mask-image: radial-gradient(125% 95% at 50% 42%, #000 30%, transparent 100%);
        }

        .ed-glow {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .ed-vig {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(135% 115% at 50% 45%, transparent 42%, rgba(0, 0, 0, .55) 100%);
        }

        /* ---------- 左侧竖脊 ---------- */
        .ed-rail {
            position: absolute;
            left: 42px;
            top: 56px;
            bottom: 66px;
            width: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .ed-rail-num {
            font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
            font-size: 13px;
            letter-spacing: .12em;
            color: var(--blue);
        }

        .ed-rail-line {
            flex: 1;
            width: 1px;
            margin: 12px 0;
            background: linear-gradient(to bottom, transparent, var(--line2), transparent);
        }

        .ed-rail-label {
            writing-mode: vertical-rl;
            font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
            font-size: 10px;
            letter-spacing: .34em;
            text-transform: uppercase;
            color: var(--faint);
        }

        /* ---------- 正文区 / 页脚 ---------- */
        .ed-body {
            position: absolute;
            left: 104px;
            right: 72px;
            top: 54px;
            bottom: 68px;
            display: flex;
            flex-direction: column;
        }

        .ed-foot {
            position: absolute;
            left: 104px;
            right: 72px;
            bottom: 26px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
            font-size: 10px;
            letter-spacing: .22em;
            text-transform: uppercase;
            color: var(--faint);
        }

        .ed-foot em {
            font-style: normal;
            color: var(--mute);
        }

        /* ---------- 页头 ---------- */
        .ed-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 40px;
        }

        .ed-eyebrow {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
            font-size: 11px;
            letter-spacing: .26em;
            text-transform: uppercase;
            color: var(--mute);
        }

        .ed-eyebrow i {
            width: 6px;
            height: 6px;
            background: var(--blue);
            display: inline-block;
            flex: none;
        }

        .ed-title {
            font-family: var(--font-title);
            font-weight: 700;
            font-size: 42px;
            line-height: 1.12;
            letter-spacing: -.012em;
            color: var(--paper);
            margin: 14px 0 0;
        }

        .ed-title em {
            font-style: normal;
            color: var(--blue);
        }

        .ed-sub {
            font-size: 15px;
            line-height: 1.55;
            color: var(--dim);
            margin-top: 10px;
        }

        .ed-hr {
            height: 1px;
            background: var(--line2);
            margin: 20px 0 0;
            flex: none;
        }

        /* ---------- 索引行（本期主力版式） ---------- */
        .ed-rows {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        .ed-row {
            display: grid;
            align-items: start;
            gap: 26px;
            padding: 15px 0;
            border-bottom: 1px solid var(--line);
        }

        .ed-row:last-child {
            border-bottom: none;
        }

        .ed-n {
            font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
            font-size: 14px;
            letter-spacing: .06em;
            color: var(--blue);
            padding-top: 5px;
        }

        .ed-h3 {
            font-family: var(--font-title);
            font-weight: 700;
            font-size: 21px;
            line-height: 1.3;
            color: var(--paper);
        }

        .ed-p {
            font-size: 14px;
            line-height: 1.68;
            color: var(--dim);
        }

        .ed-k {
            font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
            font-size: 10px;
            letter-spacing: .2em;
            text-transform: uppercase;
            color: var(--cyan);
        }

        .ed-accent { color: var(--blue); }
        .ed-cy { color: var(--cyan); }
        .ed-warn { color: var(--amber); }
        .ed-hot { color: var(--ember); }
        .ed-dim { color: var(--dim); }
        .ed-mute { color: var(--mute); }

        b.ed-b { font-weight: 700; color: var(--paper); }

        /* ---------- 面板（角标式，取代圆角卡片） ---------- */
        .ed-panel {
            position: relative;
            padding: 18px 20px;
            background: rgba(11, 18, 31, .72);
            border: 1px solid var(--line);
        }

        .ed-panel > .ed-tick {
            position: absolute;
            width: 9px;
            height: 9px;
            border: 1px solid var(--blue);
            opacity: .85;
        }

        .ed-panel > .ed-tick.tl { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
        .ed-panel > .ed-tick.br { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }

        .ed-panel.warm { border-color: rgba(255, 107, 74, .34); background: rgba(255, 107, 74, .05); }
        .ed-panel.warm > .ed-tick { border-color: var(--ember); }
        .ed-panel.alert { border-color: rgba(251, 191, 36, .34); background: rgba(251, 191, 36, .05); }
        .ed-panel.alert > .ed-tick { border-color: var(--amber); }

        /* ---------- 数据 ---------- */
        .ed-num {
            font-family: var(--font-title);
            font-weight: 700;
            font-size: 62px;
            line-height: .95;
            letter-spacing: -.035em;
            color: var(--paper);
        }

        .ed-num.sm { font-size: 44px; }

        .ed-cap {
            font-size: 13px;
            line-height: 1.6;
            color: var(--dim);
        }

        .ed-cell {
            padding: 0 26px;
            border-left: 1px solid var(--line);
        }

        .ed-cell:first-child { border-left: none; padding-left: 0; }

        /* ---------- 徽标 / 条幅 ---------- */
        .ed-chip {
            display: inline-block;
            font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
            font-size: 10px;
            letter-spacing: .18em;
            text-transform: uppercase;
            padding: 4px 9px;
            border: 1px solid var(--line2);
            color: var(--dim);
        }

        .ed-chip.amber { border-color: rgba(251, 191, 36, .5); color: var(--amber); }
        .ed-chip.cyan { border-color: rgba(34, 211, 238, .5); color: var(--cyan); }
        .ed-chip.hot { border-color: rgba(255, 107, 74, .5); color: var(--ember); }

        .ed-banner {
            border-top: 1px solid var(--line2);
            border-bottom: 1px solid var(--line2);
            padding: 13px 0;
            text-align: center;
            font-size: 16px;
            line-height: 1.5;
            color: #C6D3E8;
        }

        /* ---------- 封面：左侧「HR 的一天」日志 ---------- */
        .ed-log {
            position: absolute;
            left: 104px;
            top: 148px;
            width: 322px;
        }

        .ed-log-list {
            margin-top: 24px;
            position: relative;
            padding-left: 22px;
        }

        .ed-log-list::before {
            content: '';
            position: absolute;
            left: 3px;
            top: 6px;
            bottom: 10px;
            width: 1px;
            background: linear-gradient(to bottom, rgba(147, 166, 196, .08), rgba(255, 107, 74, .55));
        }

        .ed-log-item {
            position: relative;
            margin-bottom: 25px;
        }

        .ed-log-item::before {
            content: '';
            position: absolute;
            left: -22px;
            top: 5px;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--ink);
            border: 1px solid var(--faint);
        }

        .ed-log-item.hot::before {
            background: var(--ember);
            border-color: var(--ember);
            box-shadow: 0 0 12px rgba(255, 107, 74, .85);
        }

        .ed-log-item i {
            display: block;
            font-style: normal;
            font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
            font-size: 11px;
            letter-spacing: .1em;
            color: var(--mute);
        }

        .ed-log-item b {
            display: block;
            font-weight: 400;
            font-size: 14px;
            line-height: 1.5;
            color: #8E9DB8;
            margin-top: 3px;
        }

        .ed-log-item.hot b { color: #FFB39B; }

        /* ---------- 封面：右侧叙事 ---------- */
        .ed-cover {
            position: absolute;
            left: 508px;
            right: 88px;
            top: 122px;
        }

        .ed-cover h1 {
            font-family: var(--font-title);
            font-weight: 700;
            font-size: 66px;
            line-height: 1.1;
            letter-spacing: -.02em;
            color: var(--paper);
            margin: 20px 0 0;
        }

        .ed-cover h1 em {
            font-style: normal;
            color: var(--ember);
        }

        .ed-brand {
            font-family: var(--font-title);
            font-weight: 700;
            font-size: 34px;
            letter-spacing: -.01em;
            color: var(--blue);
        }

        .ed-statbar {
            display: flex;
            align-items: center;
            gap: 22px;
            font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
            font-size: 12px;
            letter-spacing: .1em;
            color: var(--dim);
            flex-wrap: wrap;
        }

        .ed-statbar span.sep { color: var(--faint); }

        /* ---------- 过渡页 ---------- */
        .ed-trans-num {
            position: absolute;
            right: 30px;
            bottom: -84px;
            font-family: var(--font-title);
            font-weight: 700;
            font-size: 400px;
            line-height: 1;
            letter-spacing: -.06em;
            color: rgba(56, 189, 248, .075);
            pointer-events: none;
        }

        .ed-trans {
            position: absolute;
            left: 152px;
            top: 50%;
            transform: translateY(-50%);
            max-width: 780px;
            padding-left: 34px;
            border-left: 2px solid var(--blue);
        }

        .ed-trans h2 {
            font-family: var(--font-title);
            font-weight: 700;
            font-size: 70px;
            line-height: 1.08;
            letter-spacing: -.02em;
            color: var(--paper);
            margin-top: 18px;
        }

        .ed-trans p {
            font-size: 18px;
            line-height: 1.65;
            color: var(--dim);
            margin-top: 20px;
        }

        .ed-trans .ed-eyebrow { color: var(--blue); }

        /* ---------- 两栏分屏 ---------- */
        .ed-split {
            display: grid;
            grid-template-columns: 1fr 1px 1fr;
            gap: 40px;
            flex: 1;
            min-height: 0;
            margin-top: 6px;
        }

        .ed-split .divider {
            background: linear-gradient(to bottom, transparent, var(--line2) 12%, var(--line2) 88%, transparent);
        }

        .ed-split h3 {
            font-family: var(--font-title);
            font-weight: 700;
            font-size: 22px;
            color: var(--paper);
            margin-bottom: 4px;
        }

        /* ---------- 时间轴 ---------- */
        .ed-tl {
            position: relative;
            padding-left: 30px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .ed-tl::before {
            content: '';
            position: absolute;
            left: 4px;
            top: 12px;
            bottom: 12px;
            width: 1px;
            background: linear-gradient(to bottom, var(--line2), var(--line));
        }

        .ed-tl-item { position: relative; }

        .ed-tl-item::before {
            content: '';
            position: absolute;
            left: -30px;
            top: 7px;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--ink);
            border: 1px solid var(--blue);
        }
    </style>
    <script>
        // # 禁止修改
        window.slideDataMap = new Map();
    </script>
</head>
<body>
    <!-- PPT 容器 -->
    <div class="ppt-container">
        <div class="ppt-viewport" id="ppt-viewport">
            <!-- 幻灯片将由 JavaScript 动态插入 -->
        </div>
    </div>
    
    <!-- 导航按钮 -->
    <button class="nav-btn nav-btn-prev" id="prevBtn" aria-label="上一页">
        ←
    </button>
    <button class="nav-btn nav-btn-next" id="nextBtn" aria-label="下一页">
        →
    </button>
    
    <!-- 进度条 -->
    <div class="progress-bar">
        <div class="progress-bar-fill" id="progressBarFill"></div>
    </div>
    
    <!-- 页码指示器 -->
    <div class="page-indicator" id="pageIndicator">
        1 / 1
    </div>
    
    <!-- Vite Main Entry -->
    <script type="module" src="/src/main.js"></script>

    <script type="module" src="/src/slides/slide-1.js"></script>

</html>
