name: test

on:
  push:
    branches: [main]
  pull_request:

# CI 只需要读代码，不写任何东西
permissions:
  contents: read

jobs:
  # 一键回归：run_all.js 自带「隔离实例 127.0.0.1:8799 + 临时库」，不会碰演示库
  regression:
    name: 回归（Node ${{ matrix.node }} · 12 套件 + 文档守卫 + 双模式评测）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 只测一个版本，会漏掉「上游 Node 升级后本仓库悄悄坏掉」这一类问题。
        # 真实教训：Node >=24 的 undici 开始校验 AbortSignal 的 realm，
        # 测试桩把 jsdom 的 signal 透传过去后页面静默降级成离线态、断言假红。
        # 22 是 README 声明的下限，24 代表当前主流新版本。
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 运行时零依赖，只有测试用的 jsdom 需要装
      - name: 安装测试依赖
        run: npm install --no-audit --no-fund

      # run_all.js 缺 jsdom 时会跳过 4 个前端套件，并强制以退出码 4 失败
      # （这条行为由 tools/test_runner.js 锁着，且做过反向验证）。
      # 这里仍显式断言一次：把失败**前移**到跑整套之前，几十秒的回归不必白跑。
      - name: 断言 jsdom 就位（防前端套件被静默跳过）
        run: node -e "require.resolve('jsdom'); console.log('jsdom ok')"

      - name: 一键回归（12 套件 + 文档一致性守卫 + 双模式评测）
        run: npm test

  # 抓取脚本依赖很重（scrapling + playwright 浏览器内核），CI 里不装；
  # 只做编译检查，顺带验证「缺依赖时的友好报错」这段代码本身是合法的。
  python-syntax:
    name: Python 脚本编译检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 编译检查 tools/ 下的 Python 脚本
        run: |
          python -m py_compile \
            tools/scrape_boss_jobs.py \
            tools/scrape_zhaopin_jobs.py \
            tools/import_boss_jobs.py \
            tools/build_share_pack.py \
            tools/md2dark_html.py \
            tools/build_docs_html.py

      # 文档阅读版是生成物：断言「清单与磁盘自洽」，避免新增文档忘了登记、
      # 或改了 md 却没重生（产物与文档静默不一致，是最难发现的一类过期）。
      - name: 文档阅读版清单自洽（生成物单一源）
        run: python tools/build_docs_html.py --check
